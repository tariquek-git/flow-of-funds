name: CI

# The app is live and the access gate is the only thing protecting a paid AI
# endpoint. This workflow type-checks, lints, runs the full offline test suite +
# evals, builds once, then boots that artifact in BOTH public and gated postures.
# It needs NO secrets: both smokes use fixture/dummy credentials and cannot spend.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · eval · build · public-smoke · gate-smoke
    runs-on: ubuntu-latest
    # Bound the whole job so a hung `next start` can't burn minutes.
    timeout-minutes: 20
    env:
      # Keep CI fully offline and self-contained — no AI key, no real secrets.
      AI_PROVIDER: fixture
      FOF_GATE_SECRET: ci-smoke-throwaway-secret-do-not-use
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.2.2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Match the Vercel runtime (Node 24.x).
          node-version: 24.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Test (full offline suite, no AI spend)
        run: pnpm test

      - name: Eval (offline, no AI spend)
        run: pnpm eval

      - name: Build
        run: pnpm build

      - name: Public smoke (boots built app, asserts public posture + headers)
        run: pnpm smoke:public:ci

      - name: Gate smoke (boots built app in fixture mode, asserts gate + headers)
        run: pnpm gate:smoke:ci
