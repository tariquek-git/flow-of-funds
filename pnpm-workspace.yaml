allowBuilds:
  core-js: false
  esbuild: true
  sharp: true
  unrs-resolver: true

# Force-patch transitive advisories (pnpm 11 reads overrides here, not from
# package.json). esbuild <0.28.1 (GHSA-gv7w-rqvm-qjhr high, GHSA-g7r4-m6w7-qqqr
# low) comes in via tsx; postcss <8.5.10 (GHSA-qx2v-qp2m-jg93 moderate) via
# next's build toolchain — neither ships to the browser or runtime. dompurify
# <=3.4.10 (GHSA-cmwh-pvxp-8882 moderate, ALLOWED_ATTR pollution via
# setConfig()) comes in via posthog-js, which DOES run client-side — this one
# patches real shipped browser code, not just a dev/build tool.
overrides:
  esbuild: '>=0.28.1'
  postcss: '>=8.5.10'
  dompurify: '>=3.4.11'
