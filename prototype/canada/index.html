<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!--page-->
<title>Settlement Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wdth,wght@75..100,400..700&family=Martian+Mono:wdth,wght@75..100,400..600&display=swap">
<style>
/* Layout: a working atlas. Currency index, then one currency as a layered dependency map sitting on its central bank,
   then a week-long settlement clock and a dated change line. Record panel on the right, bottom sheet on phones.
   Colour encodes one role only: accent = central bank money and finality. */
:root{
  --paper:#FFFFFF; --band:#F1F3F5; --ink:#0D1117; --muted:#4B5361; --rule:#DDE1E6; --rule-strong:#767F8C;
  --accent:#B9301A; --accent-soft:#FCECE8; --planned:#7A5600;
  --sans:"Instrument Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:"Martian Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --t-xs:11px; --t-s:13px; --t-m:15px; --t-l:18px; --t-xl:24px; --t-xxl:34px;
  --hatch:repeating-linear-gradient(135deg,color-mix(in srgb,var(--planned) 22%,transparent) 0 2px,transparent 2px 7px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E1013; --band:#171A1F; --ink:#E9EBEE; --muted:#A4ABB6; --rule:#2B3038; --rule-strong:#737C88;
  --accent:#FF826A; --accent-soft:#2B1813; --planned:#E2B94F; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E1013; --band:#171A1F; --ink:#E9EBEE; --muted:#A4ABB6; --rule:#2B3038; --rule-strong:#737C88;
  --accent:#FF826A; --accent-soft:#2B1813; --planned:#E2B94F; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--t-m)/1.5 var(--sans);font-optical-sizing:auto}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--paper)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.mono{font-family:var(--mono);font-size:var(--t-xs);letter-spacing:0;font-variation-settings:"wdth" 85}
.muted{color:var(--muted)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1240px;margin:0 auto}
.flag{display:inline-block;width:20px;height:15px;vertical-align:-2px;box-shadow:0 0 0 1px var(--rule);flex:none}
.flag svg{display:block;width:100%;height:100%}
.logo{display:inline-block;width:16px;height:16px;vertical-align:-3px;flex:none}
.logo svg{display:block;width:100%;height:100%;fill:currentColor}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{text-wrap:balance}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:12;background:var(--paper);border-bottom:1px solid var(--ink)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px}
.brand{display:flex;align-items:baseline;gap:10px;text-decoration:none}
.brand b{font-size:var(--t-l);font-weight:700;letter-spacing:-.01em;font-variation-settings:"wdth" 88}
.brand span{font-family:var(--mono);font-size:var(--t-xs);color:var(--muted)}
.nav{display:flex;gap:2px}
.nav a{font-size:var(--t-s);text-decoration:none;padding:16px 10px 14px;border-bottom:3px solid transparent;margin-bottom:-1px}
.nav a[aria-current="page"]{border-bottom-color:var(--ink);font-weight:700}

.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;padding-block:14px 0;font-size:var(--t-s)}
.crumbs a{color:var(--muted);text-decoration:none;padding:6px 0}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs [aria-current]{font-weight:600}
.crumbs .sep{color:var(--rule-strong)}

main{padding-bottom:56px}
.pagehead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 32px;align-items:end;padding-block:18px 18px;border-bottom:1px solid var(--rule)}
.pagehead h1{margin:0;font-size:var(--t-xxl);line-height:1.08;letter-spacing:-.02em;font-weight:700;font-variation-settings:"wdth" 85;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.pagehead h1 .flag{width:32px;height:24px}
.pagehead p{margin:6px 0 0;max-width:70ch;color:var(--muted)}
.pagehead .now{font-family:var(--mono);font-size:var(--t-xs);text-align:right;line-height:1.7;white-space:nowrap}
.pagehead .now b{font-weight:600}
.status-open{color:var(--ink)} .status-closed{color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:0}
.dot.on{background:var(--accent)} .dot.off{box-shadow:inset 0 0 0 1.5px var(--rule-strong)}

.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:34px 0 10px}
.section-h h2{margin:0;font-size:var(--t-l);font-weight:700;font-variation-settings:"wdth" 90}
.section-h p{margin:0;color:var(--muted);font-size:var(--t-s);max-width:70ch}

/* L1 currency ledger */
.ledger{border-top:1px solid var(--ink)}
.ccy{display:grid;grid-template-columns:132px minmax(0,1fr) 220px 260px;gap:6px 24px;align-items:center;padding:16px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.ccy:hover .ccy-code{color:var(--accent)}
.ccy-id{display:flex;align-items:center;gap:10px}
.ccy-code{font-family:var(--mono);font-size:var(--t-l);font-weight:600;font-variation-settings:"wdth" 90}
.ccy-cb{font-weight:700;font-size:var(--t-m);font-variation-settings:"wdth" 90}
.ccy-how{color:var(--muted);font-size:var(--t-s);margin-top:2px;max-width:66ch}
.strip-label{display:flex;justify-content:space-between;font-size:var(--t-xs);color:var(--muted);margin-bottom:3px}
.layerstrip{display:grid;grid-template-columns:repeat(9,1fr);gap:2px}
.layerstrip i{height:18px;background:var(--band);box-shadow:inset 0 0 0 1px var(--rule);font:normal 9px/18px var(--mono);text-align:center;color:var(--muted)}
.layerstrip i.on{background:var(--ink);color:var(--paper);box-shadow:none}
.layerstrip i.root{background:var(--accent);color:var(--paper)}
.day24{position:relative;height:18px;background:var(--band);box-shadow:inset 0 0 0 1px var(--rule)}
.day24 .open{position:absolute;top:4px;bottom:4px;background:var(--ink)}
.day24 .now{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--accent)}
.day24 .tick{position:absolute;top:0;bottom:0;width:1px;background:var(--rule-strong)}
.ccy-later{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:0;border-bottom:1px solid var(--rule)}
.ccy-later div{display:flex;align-items:center;gap:10px;padding:10px 16px 10px 0;font-size:var(--t-s);color:var(--muted);border-top:1px solid var(--rule)}
.ccy-later b{font-family:var(--mono);font-size:var(--t-xs);color:var(--ink);font-weight:600}
.idx{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:32px 40px}
.idx ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.idx li a{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--rule);text-decoration:none}
.idx li a:hover span:first-child{text-decoration:underline}
.idx li a .mono{color:var(--muted);white-space:nowrap}
.idx li a.empty{color:var(--muted)}

/* body split with panel */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:0 32px}
.split.has-panel{grid-template-columns:minmax(0,1fr) minmax(0,400px)}
.main-col{min-width:0;container-type:inline-size}

/* L2 layer map */
.map{position:relative;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink)}
.map svg.edges{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible;z-index:2}
.lrow{display:grid;grid-template-columns:168px minmax(0,1fr);min-height:76px;border-top:1px solid var(--rule)}
.lrow:first-of-type{border-top:0}
.lrow{--rowbg:var(--paper)}
.lrow:nth-of-type(even){background:var(--band);--rowbg:var(--band)}
.lhead{padding:12px 14px 12px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-content:center}
.lhead{position:relative;z-index:3}
.lhead .lid{font-family:var(--mono);font-size:10px;color:var(--muted);align-self:start;padding-top:2px}
.lhead b{font-size:var(--t-s);line-height:1.2;font-variation-settings:"wdth" 85}
.lhead > span:not(.lid){grid-column:1/-1;font-size:var(--t-xs);color:var(--muted);line-height:1.3}
.lnodes{display:grid;grid-auto-flow:row dense;grid-template-columns:repeat(var(--cols,9),minmax(0,1fr));gap:8px;align-items:center;padding:14px 0 14px 4px;position:relative;z-index:3}
.node{all:unset;position:relative;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:1px;min-height:44px;justify-content:center;padding:7px 9px;background:var(--paper);border:1px solid var(--rule-strong);border-radius:2px;transition:opacity .15s}
.node .nm{font-weight:700;font-size:var(--t-s);line-height:1.15;font-variation-settings:"wdth" 80;display:flex;flex-wrap:wrap;gap:2px 5px;align-items:center;min-width:0}
.node .sb{font-size:var(--t-xs);color:var(--muted);line-height:1.25;font-variation-settings:"wdth" 85}
.node.k-product{border:0;border-top:2px solid var(--ink);border-radius:0;background:color-mix(in srgb,var(--rowbg) 82%,transparent);padding:6px 2px 2px}
.node.k-product.planned{border-top-color:var(--planned);border-top-style:dashed;background-image:none}
.node.k-product.planned::after{position:static;align-self:flex-start;margin-top:4px}
.node.k-product .nm{font-variation-settings:"wdth" 85}
.node.k-system{border:1.5px solid var(--ink)}
.node.l-1{border:2px solid var(--accent)}
.node.k-access{border:1.5px dotted var(--ink)}
.node.planned{background-image:var(--hatch)}
.node.planned::after{content:"planned";position:absolute;top:-8px;right:6px;font:600 9px/14px var(--mono);color:var(--planned);background:var(--paper);border:1px solid currentColor;padding:0 4px}
.node.unknown{border-style:dashed}
.node:hover{outline:1px solid var(--ink)}
.node:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.node.sel{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.node.sel .sb{color:var(--paper);opacity:.8}
.node.sel.planned::after{color:var(--planned)}
.map.has-sel .node:not(.lit){color:var(--muted);border-color:var(--rule);background-image:none}
.map.has-sel .node.k-product:not(.lit){border-top-color:var(--rule)}
.map.has-sel .node:not(.lit) .nm{font-weight:400}
.map.has-sel .node:not(.lit) .logo{opacity:.5}
.map.has-sel .base:not(.lit){background:var(--band);border-top-color:var(--rule)}
.node.lit:not(.sel){box-shadow:0 0 0 1px var(--ink)}
.base{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:168px minmax(0,1fr) auto;align-items:center;gap:0 4px;width:100%;padding:14px 12px 14px 0;background:var(--accent-soft);border-top:4px double var(--accent);position:relative;z-index:3}
.base .lhead{padding:0 14px 0 0}
.base .lhead .lid{color:var(--accent)}
.base .bname{font-weight:700;font-size:var(--t-l);font-variation-settings:"wdth" 85;display:flex;align-items:center;gap:10px;padding-left:4px}
.base .bsub{font-family:var(--mono);font-size:var(--t-xs);color:var(--accent);text-align:right}
.base.sel{outline:2px solid var(--ink);outline-offset:-2px}
.base:focus-visible{outline:2px solid var(--ink);outline-offset:-4px}
.e{fill:none;transition:opacity .15s}
.e-runs{stroke:var(--ink);stroke-width:1.2}
.e-settle-out{stroke:var(--accent);stroke-width:5}
.e-settle-in{stroke:var(--paper);stroke-width:1.6}
.e-access{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:1.5 3.5;stroke-linecap:round}
.e-plan-out{stroke:var(--planned);stroke-width:5;stroke-dasharray:7 4}
.e-plan-in{stroke:var(--paper);stroke-width:1.6}
.e-lab.plan text{fill:var(--planned)}
.e-unknown{stroke:var(--rule-strong);stroke-width:1.2;stroke-dasharray:3 3}
.e-lab rect{fill:var(--paper)}
.e-lab text{font:600 10px var(--mono);fill:var(--accent)}
.e-q{font:700 12px var(--mono);fill:var(--muted)}
.map.has-sel .e:not(.lit),.map.has-sel .e-lab:not(.lit),.map.has-sel .e-q:not(.lit){opacity:.12}
.maplegend{display:flex;flex-wrap:wrap;gap:6px 20px;font-size:var(--t-xs);color:var(--muted);padding:10px 0 0}
.maplegend span{display:inline-flex;align-items:center;gap:6px}
.maplegend svg{flex:none}
.hint{font-size:var(--t-s);color:var(--muted);margin:8px 0 0}
.narrow-hint{display:none}

/* finality scale and seats column */
.map.with-seats{display:grid;grid-template-columns:minmax(0,1fr) 190px;gap:0}
.stack{min-width:0}
.finrow{display:grid;grid-template-columns:168px minmax(0,1fr);border-bottom:1px solid var(--rule)}
.finrow .lhead{padding:8px 14px 8px 0}
.finscale{display:grid;grid-auto-flow:row dense;grid-template-columns:repeat(var(--cols,9),minmax(0,1fr));gap:8px;align-items:center;padding:8px 0 8px 4px}
.finscale span{font:600 10px var(--mono);padding:4px 6px;border-top:3px solid currentColor}
.finscale .fin-rt{color:var(--accent)}
.finscale .fin-nbd{color:var(--ink)}
.finscale .fin-unk,.finscale .fin-mix{color:var(--muted);border-top-style:dashed}
.finscale .fin-day{color:var(--ink)}
.node .fin{font:600 9.5px/1.3 var(--mono);margin-top:3px}
.node .fin-rt{color:var(--accent)} .node .fin-nbd,.node .fin-day{color:var(--ink)} .node .fin-unk,.node .fin-mix{color:var(--muted)}
.node.planned .fin-rt{color:var(--planned)}
.node.sel .fin{color:var(--paper)}
.map.has-sel .node:not(.lit) .fin{color:var(--muted)}
.seats{border-left:1px solid var(--rule);padding:14px 0 14px 14px;display:flex;flex-direction:column;gap:22px}
.map.with-seats{background:linear-gradient(to left,var(--band) 190px,transparent 190px)}
.seats .node,.seats-h{position:relative;z-index:3}
.seats-h{background:var(--band)}
.seats-h b{display:block;font-size:var(--t-s);font-variation-settings:"wdth" 85}
.seats-h span{display:block;font-size:var(--t-xs);color:var(--muted);line-height:1.35;margin-top:2px}
.seats .node{margin-right:10px}

/* clock */
.clockbox{overflow-x:auto;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule);-webkit-overflow-scrolling:touch}
.clockbox svg{display:block;min-width:720px;width:100%;height:auto}
.c-day{font:600 11px var(--mono);fill:var(--ink)}
.c-date{font:400 10px var(--mono);fill:var(--muted)}
.c-row{font:700 12px var(--sans);fill:var(--ink)}
.c-sub{font:400 10px var(--sans);fill:var(--muted)}
.c-grid{stroke:var(--rule);stroke-width:1}
.c-gridd{stroke:var(--rule-strong);stroke-width:1}
.c-open{fill:var(--accent)}
.c-cycle{stroke:var(--rule-strong);stroke-width:1}
.c-cust{fill:none;stroke:var(--ink);stroke-width:1.2;stroke-dasharray:2 2}
.c-settle{fill:var(--accent)}
.c-settle-t{font:600 9.5px var(--mono);fill:var(--accent)}
.c-plan{fill:url(#hatch)}
.c-plan-edge{fill:none;stroke:var(--planned);stroke-width:1}
.c-plan-t{font:600 9.5px var(--mono);fill:var(--planned)}
.c-unk{font:400 11px var(--sans);fill:var(--muted);font-style:italic}
.c-now{stroke:var(--accent);stroke-width:2}
.c-now-t{font:600 10px var(--mono);fill:var(--accent)}
.c-hol{fill:var(--band)}
.c-hol-t{font:600 9.5px var(--mono);fill:var(--muted)}
.c-cut{stroke:var(--paper);stroke-width:1.5}
.clockwrap{position:relative}
.clocklabels{display:none;position:relative}
.clocklabels div{position:absolute;left:0;right:6px;display:flex;align-items:center;font-size:11px;line-height:1.15;border-top:1px solid var(--rule)}
.clockbox svg.clock-days{display:none}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:var(--t-s);cursor:pointer;user-select:none;min-height:40px}
.toggle input{width:18px;height:18px;accent-color:var(--ink);margin:0}
.clock-notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:4px 28px;margin:10px 0 0;padding:0;list-style:none;font-size:var(--t-s);color:var(--muted)}
.clock-notes li{padding:6px 0;border-bottom:1px solid var(--rule)}
.clock-notes b{color:var(--ink);font-weight:700}

/* timeline */
.tlbox{overflow-x:auto;border-top:1px solid var(--ink)}
.tlbox svg{display:block;min-width:640px;width:100%;height:auto}
.t-axis{stroke:var(--ink);stroke-width:1.5}
.t-yr{font:600 10px var(--mono);fill:var(--muted)}
.t-done{fill:var(--ink)}
.t-plan{fill:url(#hatch2);stroke:var(--planned);stroke-width:1.2}
.t-now{stroke:var(--accent);stroke-width:2}
.t-now-t{font:600 10px var(--mono);fill:var(--accent)}
.t-n{font:600 10px var(--mono);fill:var(--paper)}
.t-np{font:600 10px var(--mono);fill:var(--planned)}
.tl-list{list-style:none;margin:0;padding:0}
.tl-list li{display:grid;grid-template-columns:28px 120px minmax(0,1fr);gap:0 12px;padding:9px 0;border-bottom:1px solid var(--rule);font-size:var(--t-s)}
.tl-list .n{font-family:var(--mono);font-size:var(--t-xs);font-weight:600;width:20px;height:20px;line-height:20px;text-align:center;border-radius:50%;background:var(--ink);color:var(--paper)}
.tl-list .n.p{background:none;color:var(--planned);box-shadow:inset 0 0 0 1.2px var(--planned)}
.tl-list .d{font-family:var(--mono);font-size:var(--t-xs);color:var(--muted);padding-top:2px}
.tl-list .s{display:block;font-size:var(--t-xs);color:var(--muted)}

/* type view */
.typelist{list-style:none;margin:0;padding:0;border-top:1px solid var(--ink)}
.typehead{display:grid;grid-template-columns:28px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);gap:4px 16px;padding:10px 0 8px;border-top:1px solid var(--ink);font-size:var(--t-xs);color:var(--muted)}
.typelist li button{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:28px minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr) minmax(0,1.2fr);gap:4px 16px;width:100%;padding:12px 0;border-bottom:1px solid var(--rule);align-items:baseline}
.typelist li button:hover b{text-decoration:underline}
.typelist li button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.typelist .set{color:var(--accent);font-weight:700}

/* panel */
.panel{min-width:0;border-left:1px solid var(--ink);padding:14px 0 24px 24px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 53px);max-height:calc(100vh - 53px - env(safe-area-inset-top,0px));overflow:auto;overscroll-behavior:contain}
.pbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.pbar .grip{display:none}
.btn{border:1px solid var(--rule-strong);background:var(--paper);border-radius:2px;padding:0 12px;min-height:36px;cursor:pointer;font-size:var(--t-s);font-weight:600}
.btn:hover{border-color:var(--ink)}
.btn:disabled{color:var(--muted);border-color:var(--rule);cursor:default}
.btn.strong{border-color:var(--ink)}
.panel .ptype{font-size:var(--t-s);color:var(--muted);margin:0 0 2px}
.panel h2{margin:0 0 12px;font-size:var(--t-xl);line-height:1.12;font-weight:700;letter-spacing:-.01em;font-variation-settings:"wdth" 85;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.panel h2:focus{outline:none}
.panel h2 .tag{font:600 10px var(--mono);color:var(--planned);border:1px solid currentColor;padding:1px 4px}
dl.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 14px;margin:0 0 14px;padding:12px 0;border-block:1px solid var(--rule);font-size:var(--t-s)}
dl.facts dt{font-size:var(--t-s);color:var(--muted)}
dl.facts dd{margin:0}
dl.facts .acc{color:var(--accent);font-weight:700}
.unk{color:var(--muted);font-style:italic}
.explain{margin:0 0 6px}
.src{font-size:var(--t-xs);color:var(--muted);margin:0 0 18px}
.ph{font-size:var(--t-s);font-weight:700;margin:0 0 8px;display:flex;justify-content:space-between;gap:12px}
.ph span:last-child{font-weight:400;color:var(--muted)}
.ladder{list-style:none;margin:0 0 10px;padding:0}
.rung{display:grid;grid-template-columns:20px minmax(0,1fr);gap:0 10px}
.rung .rl{position:relative}
.rung .rl::before{content:"";position:absolute;left:7px;top:0;bottom:0;border-left:5px double var(--accent)}
.rung.k-runs .rl::before{border-left:1.2px solid var(--ink);left:9px}
.rung.k-plan .rl::before{border-left:5px double var(--planned)}
.rung:last-child .rl::before{display:none}
.rung .rl::after{content:"";position:absolute;left:4px;top:7px;width:12px;height:12px;background:var(--paper);border:2px solid var(--ink);border-radius:2px}
.rung.root .rl::after{border-color:var(--accent);background:var(--accent)}
.rung.cur .rl::after{background:var(--ink)}
.rung.root .rl::after{border-color:var(--accent);background:var(--accent)}
.rung .rb{padding:3px 0 14px;font-size:var(--t-s)}
.rung .rb button{all:unset;cursor:pointer;font-weight:700}
.rung .rb button:hover{text-decoration:underline}
.rung .rb button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.rung .how{display:block;font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:1px}
.rung.root .how{color:var(--accent)}
.drillrow{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 6px}
.feeders{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--rule);font-size:var(--t-s)}
.feeders li{border-bottom:1px solid var(--rule)}
.feeders button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;gap:10px;width:100%;padding:9px 0}
.feeders button:hover b{text-decoration:underline}
.feeders button:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
.today{margin:18px 0 6px}
.today .day24{height:22px}
.today .hrs{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9.5px;color:var(--muted);margin-top:3px}
.flowlink{display:inline-flex;align-items:center;min-height:40px;margin:8px 0 10px;color:var(--accent);font-weight:700;text-decoration:none}
.flowlink:hover{text-decoration:underline}
details{border-top:1px solid var(--rule)}
details:last-of-type{border-bottom:1px solid var(--rule)}
summary{cursor:pointer;min-height:40px;display:flex;align-items:center;justify-content:space-between;font-weight:700;font-size:var(--t-s);list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--mono);color:var(--muted)}
details[open] summary::after{content:"−"}
details>div{padding:0 0 12px;font-size:var(--t-s)}
details ul{margin:0;padding-left:16px}
details li{margin:0 0 6px}
.srcs{list-style:none!important;padding:0!important}
.srcs li{margin:0 0 10px}
.srcs .mono{display:block;color:var(--muted)}

/* Railroom */
.flowtabs{display:flex;flex-wrap:wrap;gap:4px 18px;padding-top:12px;font-size:var(--t-s)}
.flowtabs a{text-decoration:none;color:var(--muted);padding:6px 0;border-bottom:2px solid transparent}
.flowtabs a[aria-current]{color:var(--ink);font-weight:700;border-bottom-color:var(--ink)}
.flow-head{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between;padding-block:18px 6px}
.flow-head h1{margin:0;font-size:var(--t-xxl);line-height:1.08;font-weight:700;letter-spacing:-.02em;font-variation-settings:"wdth" 85}
.lede{max-width:70ch;color:var(--muted);margin:4px 0 14px}
.diagram{overflow-x:auto;border-block:1px solid var(--ink);margin:0 0 14px}
.diagram svg{display:block}
.lane-label{font:700 12px var(--sans);fill:var(--ink)}
.lane-label.settle{fill:var(--accent)}
.lane-rule{stroke:var(--rule)}
.lane-rule.settle{stroke:var(--accent);stroke-dasharray:2 3}
.step{cursor:pointer}
.step-num{font:600 11px var(--mono);fill:var(--muted)}
.step .ln{stroke:var(--rule-strong)}
.step.on .ln{stroke:var(--ink)}
.step .ln.settle{stroke:var(--accent)}
.step:not(.on) .ln.settle{opacity:.5}
.step .lbl{font:600 10px var(--mono);fill:var(--muted);paint-order:stroke;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.step.on .lbl,.step.on .step-num{fill:var(--ink)}
.step .lbl.final{fill:var(--accent)}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 6px}
.scrub{flex:1;min-width:220px;display:grid;gap:4px}
.scrub input{width:100%;accent-color:var(--ink);min-height:28px}
.marks{position:relative;height:16px;font-size:var(--t-xs);color:var(--muted)}
.marks span{position:absolute;top:0}
.caption{min-height:3.2em;max-width:72ch;font-size:var(--t-l);margin:4px 0 16px;font-variation-settings:"wdth" 90}
.caption .mono{display:block;color:var(--muted)}
.four{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:0 28px;border-top:1px solid var(--ink);margin:6px 0 18px}
.four div{padding:12px 0;border-bottom:1px solid var(--rule)}
.four h3{margin:0 0 4px;font:600 var(--t-xs) var(--mono)}
.four h3.acc{color:var(--accent)}
.four p{margin:0 0 4px;font-size:var(--t-s)}
.steps-text{padding-left:22px;max-width:76ch;font-size:var(--t-s)}
.steps-text li{margin:0 0 8px;color:var(--muted)}
.steps-text li[aria-current="step"]{color:var(--ink);font-weight:700}
.steps-text .mono{font-weight:400}

.foot{border-top:1px solid var(--ink);padding-block:14px 30px;font-size:var(--t-xs);color:var(--muted);display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:6px 32px}
.err{border:1px solid var(--accent);padding:12px;margin:20px 0}

/* phones and narrow windows */
@media (max-width: 980px){
  .ccy{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 16px}
  .ccy-main{grid-column:1/-1;order:-1}
  .ccy-id{order:-2;grid-column:1/-1}
}
@media (max-width: 900px){
  .split.has-panel{grid-template-columns:minmax(0,1fr)}
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:15;height:40vh;height:40svh;max-height:none;border-left:0;border-top:1px solid var(--ink);background:var(--paper);
    padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -8px 24px color-mix(in srgb,var(--ink) 12%,transparent)}
  .panel.full{height:calc(100vh - 52px - env(safe-area-inset-top,0px))}
  .pbar{position:sticky;top:0;background:var(--paper);padding:10px 0 8px;z-index:2}
  .pbar .grip{display:inline-flex;align-items:center}
  .split.has-panel .main-col{padding-bottom:42vh}
  html:has(.panel){scroll-padding-bottom:42vh}
  .pagehead{grid-template-columns:minmax(0,1fr)}
  .pagehead .now{text-align:left}
  .pagehead h1{font-size:28px}
  .typelist li button{grid-template-columns:28px minmax(0,1fr)}
  .typelist li button > :nth-child(n+3){grid-column:2}
  .typehead{display:none}
  .tl-list li{grid-template-columns:28px minmax(0,1fr)}
  .tl-list li .d{grid-column:2}
  .tl-list li > span:last-child{grid-column:2}
}
@container (max-width: 860px){
  .map.with-seats{display:block;background:none}
  .seats{border-left:0;border-top:1px solid var(--rule);flex-direction:row;flex-wrap:wrap;gap:10px;padding:12px 0}
  .seats-h{flex-basis:100%}
  .seats .node{flex:1 1 140px;margin:0}
  .finrow{display:none}
  .lrow{grid-template-columns:minmax(0,1fr)}
  .lhead{padding:10px 0 0;grid-template-columns:auto auto;justify-content:start}
  .lhead > span:not(.lid){display:none}
  .lnodes{display:flex;flex-wrap:wrap;justify-content:center;gap:12px 8px;padding:12px 0 16px}
  .lnodes .node{flex:0 1 auto;max-width:calc(50% - 4px);min-width:96px}
  .base{grid-template-columns:minmax(0,1fr);gap:4px;padding:12px}
  .base .lhead{display:none}
  .base .bsub{text-align:left;padding-left:4px}
  .clockwrap{display:grid;grid-template-columns:78px minmax(0,1fr);border-top:1px solid var(--ink)}
  .clocklabels{display:block}
  .clockbox{border-top:0}
  .clockbox svg.clock-wide{display:none!important}
  .clockbox svg.clock-days{display:block!important;min-width:770px;width:770px!important}
  .scrollhint{display:block}
  .narrow-hint{display:block}
  .lhead b{background:var(--paper);padding:0 4px 0 0}
  .lrow:nth-of-type(even) .lhead b{background:var(--band)}
}
.scrollhint{display:none;font-family:var(--mono);font-size:10px;color:var(--muted);margin:6px 0 0}
@media (max-width: 560px){
  .ccy{grid-template-columns:minmax(0,1fr)}
  .nav a{padding-inline:8px}
  .brand span{display:none}
}
@media (max-width: 600px){.tlbox{display:none}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}

c\" width=\"100%\" height=\"100%\"/><path stroke=\"#fff\" d=\"M0-23.5v3M0 17v3.5m0 3v3\"/><\/g><\/g><\/svg>"}}</script>
<script>
(function(){
'use strict';
const INLINE = document.getElementById('atlas-inline').textContent.trim();
const HASH_ONLY = !!INLINE;
const ICONS = JSON.parse(document.getElementById('icons-inline').textContent);
const TZ = 'America/Toronto';
const LAYER_ORDER = ['7','6','5','4a','4b','3','2a','2b','1'];
const STAGE = {'7':['Payment type',''], '4a':['Network and rules','4a'], '4b':['Clearing','4b'], '1':['Settlement','1']};
const STAGE_DOES = {'7':'What the customer does.', '4a':'Who sets the rules and carries the messages.', '4b':'Where items are exchanged and netted.', '1':'Where banks pay each other in central bank money.'};
const DAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MODE = {'rtgs':'Real-time gross','deferred-net':'Deferred net','real-time-funded':'Real time, funded account','central-bank-ledger':'Central bank ledger','pvp':'Payment versus payment','on-chain':'On-chain','none':'Does not settle','unknown':'Not confirmed'};
// Column placement for the wide layer map. Presentation only, keyed by node id.
const LAYOUT = {
  CAD:{cols:9, pos:{'ca-rtr-payment':'1','ca-wire':'2','ca-direct-deposit':'3','ca-pad':'4','ca-cheque':'5','ca-pos-debit':'6','ca-etransfer':'7','ca-credit-card':'8 / span 2',
        'interac-debit':'6','interac-e-transfer':'7','visanet-canada':'8','mastercard-canada':'9','acss':'3 / span 4','rtr':'1','lynx':'2 / span 6'}},
  USD:{cols:9, pos:{'fedwire-funds':'1 / span 4'}}
};

let D, IDX = {};
let S = {view:'home', ccy:null, node:null, type:null, flow:null, step:1, holiday:false, full:false};
let lastFocus = null, ro = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (q, r=document) => r.querySelector(q);
const $$ = (q, r=document) => [...r.querySelectorAll(q)];
const flag = cc => cc && ICONS.flag[cc] ? `<span class="flag" aria-hidden="true">${ICONS.flag[cc]}</span>` : '';
const logo = k => k && ICONS.logo[k] ? `<span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="${ICONS.logo[k]}"/></svg></span>` : '';
const fmtDate = d => { const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const [y,mo,da]=d.split('-'); return da ? `${+da} ${m[+mo-1]} ${y}` : `${m[+mo-1]} ${y}`; };

async function load(){
  if (INLINE) return JSON.parse(INLINE);
  const r = await fetch('../../data/atlas.json', {cache:'no-store'});
  if (!r.ok) throw new Error('data/atlas.json returned ' + r.status);
  return r.json();
}

/* ---------- index ---------- */
function build(){
  for (const k of ['groups','regions','parties','systems','scenarios','sources','layers','currencies','products','access']) IDX[k] = Object.fromEntries((D[k]||[]).map(x => [x.id, x]));
  IDX.node = {};
  D.systems.forEach(s => IDX.node[s.id] = {id:s.id, kind:'system', rec:s, region:s.region, layer:s.layer, name:s.name, short:s.short});
  D.products.forEach(p => IDX.node[p.id] = {id:p.id, kind:'product', rec:p, region:p.region, layer:'7', name:p.name, short:p.name});
  D.access.forEach(a => IDX.node[a.id] = {id:a.id, kind:'access', rec:a, region:a.region, layer:a.layer, name:a.name, short:a.name});
  // edges: from upper to lower
  IDX.edges = [];
  D.products.forEach(p => [p.runs_on].flat().forEach(t => IDX.edges.push({from:p.id, to:t, type:'runs'})));
  D.systems.forEach(s => { if (s.settles_in) IDX.edges.push({from:s.id, to:s.settles_in, type:'settle', label:s.settles_label||''}); });
  D.access.forEach(a => { if (a.holds_account_at) IDX.edges.push({from:a.id, to:a.holds_account_at, type:'access'}); if (a.through) IDX.edges.push({from:a.id, to:a.through, type:'access'}); });
  IDX.down = {}; IDX.up = {};
  IDX.edges.forEach(e => { (IDX.down[e.from] ||= []).push(e); (IDX.up[e.to] ||= []).push(e); });
  IDX.flowsFor = {};
  D.scenarios.forEach(sc => { const ids = new Set([sc.rail]); sc.steps.forEach(st => st.via && IDX.systems[st.via] && ids.add(st.via)); ids.forEach(id => (IDX.flowsFor[id] ||= []).push(sc.id)); });
  IDX.ccyByRegion = Object.fromEntries(D.currencies.filter(c => c.region).map(c => [c.region, c]));
}
const node = id => IDX.node[id];
const sys = id => IDX.systems[id];
const party = id => IDX.parties[id];
function reach(id, dir){ const out = new Set(); const st=[id]; while(st.length){ const c=st.pop(); for (const e of (dir==='down'?IDX.down[c]:IDX.up[c])||[]){ const n = dir==='down'?e.to:e.from; if(!out.has(n)){ out.add(n); st.push(n);} } } return out; }
function pathDown(id){ // single primary chain: follow first outgoing edge until root
  const out=[{id, via:null}]; const seen=new Set([id]); let c=id;
  while(true){ const es=(IDX.down[c]||[]).filter(e=>e.type!=='access' || node(c).kind==='access'); if(!es.length) break; const e=es[0]; if(seen.has(e.to)) break; out.push({id:e.to, via:e}); seen.add(e.to); c=e.to; }
  return out;
}

// How fast a payment type becomes final between banks, read off its settlement path.
function finality(id){
  const n = node(id); if (!n) return null;
  if (n.rec.status==='planned') return {b:'rt', t:'real time, once live'};
  if (n.kind==='product' && Array.isArray(n.rec.runs_on) && n.rec.runs_on.length>1) {
    const parts = n.rec.runs_on.map(t => ({s:sys(t), f:finality(t)}));
    if (new Set(parts.map(p=>p.f.b)).size>1) return {b:'mix', t:parts.map(p=>`${p.s.short} ${p.f.t}`).join(', ')};
    return parts[0].f;
  }
  const chain = pathDown(id).map(x=>node(x.id)).filter(x=>x.kind==='system');
  if (chain.some(x=>x.rec.settlement_mode==='unknown')) return {b:'unk', t:'not confirmed'};
  const custom = chain.find(x=>x.rec.final_label); if (custom) return {b:'day', t:custom.rec.final_label};
  if (chain.some(x=>x.rec.settlement_mode==='deferred-net')) return {b:'nbd', t:'next business day'};
  return {b:'rt', t:'real time'};
}
const FIN_LABEL = {rt:'Real time', nbd:'Next business day', day:'Daily, on the value date', mix:'Depends on the card network', unk:'Not confirmed'};

/* ---------- time ---------- */
function torontoNow(){
  const f = new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',weekday:'short',hour12:false});
  const p = Object.fromEntries(f.formatToParts(new Date()).map(x=>[x.type,x.value]));
  const dow = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(p.weekday);
  const h = +p.hour % 24, m = +p.minute;
  return {dow, h, m, mins:h*60+m, date:`${p.year}-${p.month}-${p.day}`, label:`${p.weekday} ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`};
}
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+(m||0); };
const fmtMin = m => `${String(Math.floor(m/60)%24).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;
function isBiz(dow, holiday){ return dow<5 && !(holiday && dow===0); }
// open intervals [start,end) in minutes for one weekday, from a system's windows
function openIntervals(s, dow, holiday){
  const out=[];
  for (const w of s.windows||[]) {
    if (w.kind!=='open') continue;
    if (w.days==='daily') { out.push([0,1440]); continue; }
    if (w.days==='business') {
      if (w.start.endsWith('-1')) { // starts the previous evening
        const st = toMin(w.start.slice(0,-2)), en = toMin(w.end);
        if (isBiz(dow, holiday)) out.push([0,en]);
        if (isBiz((dow+1)%7, holiday)) out.push([st,1440]);
      } else if (isBiz(dow, holiday)) out.push([toMin(w.start), toMin(w.end)]);
    }
  }
  return out;
}
function openStatus(s){
  const n = torontoNow(); const iv = openIntervals(s, n.dow, false);
  const open = iv.some(([a,b]) => n.mins>=a && n.mins<b);
  if (open) { const end = iv.find(([a,b]) => n.mins>=a && n.mins<b)[1]; return {open, text:`open until ${fmtMin(end===1440?0:end)}${end===1440?' (next day)':''} ET`}; }
  for (let k=0;k<8;k++){ const d=(n.dow+k)%7; const ivs=openIntervals(s,d,false).filter(([a])=>k>0 || a>n.mins).sort((x,y)=>x[0]-y[0]); if(ivs.length){ return {open, text:`opens ${k===0?'today':k===1?'tomorrow':DAYS[d]} ${fmtMin(ivs[0][0])} ET`}; } }
  return {open, text:'hours not confirmed'};
}

/* ---------- routing ---------- */
function toURL(st=S){
  if (HASH_ONLY){
    let h='';
    if (st.view==='flow') h = `flow-${st.flow}${st.step>1?'-'+st.step:''}`;
    else if (st.view==='type') h = `type-${st.type}`;
    else if (st.view==='ccy') h = st.ccy.toLowerCase() + (st.node ? '-'+st.node : '');
    return h ? '#'+h : location.pathname + location.search;
  }
  const p = new URLSearchParams();
  if (st.view==='flow'){ p.set('flow', st.flow); if (st.step>1) p.set('step', st.step); }
  else if (st.view==='type') p.set('type', st.type);
  else if (st.view==='ccy'){ p.set('ccy', st.ccy); if (st.node) p.set('node', st.node); }
  const q=p.toString(); return location.pathname + (q?'?'+q:'');
}
function fromURL(){
  const s = {view:'home', ccy:null, node:null, type:null, flow:null, step:1, holiday:S.holiday, full:false};
  let flow, step, type, ccy, nd;
  if (HASH_ONLY){
    const h = decodeURIComponent(location.hash.slice(1)); let m;
    if ((m = h.match(/^flow-(.+?)(?:-(\d+))?$/))) { flow=m[1]; step=m[2]; }
    else if ((m = h.match(/^type-(.+)$/))) type=m[1];
    else if ((m = h.match(/^([a-z]{3})(?:-(.+))?$/))) { ccy=m[1].toUpperCase(); nd=m[2]; }
  } else {
    const p = new URLSearchParams(location.search);
    flow=p.get('flow'); step=p.get('step'); type=p.get('type'); ccy=p.get('ccy'); nd=p.get('node');
  }
  if (flow && IDX.scenarios[flow]) { s.view='flow'; s.flow=flow; s.step=Math.min(Math.max(1,+step||1), IDX.scenarios[flow].steps.length); }
  else if (type && IDX.groups[type]) { s.view='type'; s.type=type; }
  else if (ccy && IDX.currencies[ccy] && IDX.currencies[ccy].phase===1) { s.view='ccy'; s.ccy=ccy; if (nd && node(nd) && node(nd).region===IDX.currencies[ccy].region) s.node=nd; }
  return s;
}
function go(patch, {replace=false, focus=false}={}){
  S = {...S, ...patch};
  try { (replace?history.replaceState:history.pushState).call(history, null, '', toURL()); } catch(e){}
  render();
  if (focus) {
    $('#ptitle')?.focus({preventScroll:true});
    bringSelectedIntoView();
  }
}
const href = patch => toURL({...S, ...patch});
window.addEventListener('popstate', () => { S = fromURL(); render(); });
window.addEventListener('hashchange', () => { if (HASH_ONLY){ S = fromURL(); render(); } });

/* ---------- render shell ---------- */
function render(){
  const navHome = $('#nav-home'), navFlow = $('#nav-flow');
  navHome.toggleAttribute('aria-current', S.view!=='flow'); if (S.view!=='flow') navHome.setAttribute('aria-current','page');
  navFlow.toggleAttribute('aria-current', S.view==='flow'); if (S.view==='flow') navFlow.setAttribute('aria-current','page');
  navHome.href = href({view:'home',ccy:null,node:null,type:null,flow:null});
  navFlow.href = href({view:'flow',flow:D.scenarios[0].id,step:1,node:null});
  const app = $('#app');
  if (ro) { ro.disconnect(); ro = null; }
  if (S.view==='home') app.innerHTML = vHome();
  else if (S.view==='type') app.innerHTML = vType();
  else if (S.view==='flow') app.innerHTML = vFlow();
  else app.innerHTML = vCcy();
  wire();
  if (S.view==='ccy') { drawEdges(); const cb = $('.clockbox'); if (cb && cb.scrollWidth > cb.clientWidth + 2 && window.matchMedia('(max-width: 600px)').matches) { const n = torontoNow(); cb.scrollLeft = Math.max(0, (n.dow + n.mins/1440)*110 - cb.clientWidth*0.5); } }
  const t = S.view==='ccy' ? (S.node ? `${node(S.node).short} · ${S.ccy}` : S.ccy) : S.view==='flow' ? 'Railroom' : S.view==='type' ? IDX.groups[S.type].name : '';
  document.title = t ? `${t} · Settlement Map` : 'Settlement Map';

function nodeBtn(n, pos, lit){

}

function drawEdges(){
  const map = $('#map'), svg = $('#edges'); if (!map || !svg) return;
  const draw = () => {
    const mb = map.getBoundingClientRect();
    const box = id => { const el = map.querySelector(`[data-node="${CSS.escape(id)}"]`); if(!el) return null; const b = el.getBoundingClientRect(); return {x:b.left-mb.left, y:b.top-mb.top, w:b.width, h:b.height, base:el.classList.contains('base')}; };
    const lit = S.node ? new Set([S.node, ...reach(S.node,'down'), ...reach(S.node,'up')]) : null;
    const upS = S.node ? new Set([S.node, ...reach(S.node,'up')]) : null, dnS = S.node ? new Set([S.node, ...reach(S.node,'down')]) : null;
    const narrow = map.clientWidth < 860;
    // On narrow screens the product lines only appear for the selected path, so the map stays legible.
    const es = IDX.edges.filter(e => box(e.from) && box(e.to) && !(narrow && e.type==='runs' && (!lit || !lit.has(e.from) || !lit.has(e.to))));
    map.classList.toggle('narrow', narrow);
    // spread attachment points along node edges
    const outs = {}, ins = {};
    es.forEach(e => { (outs[e.from] ||= []).push(e); (ins[e.to] ||= []).push(e); });
    const cx = id => { const b = box(id); return b.x + b.w/2; };
    Object.values(outs).forEach(a => a.sort((p,q)=>cx(p.to)-cx(q.to)));
    Object.values(ins).forEach(a => a.sort((p,q)=>cx(p.from)-cx(q.from)));
    const attach = (b, list, e, base, side) => {
      const i = list.indexOf(e), k = list.length;
      const other = box(side==='in' ? e.from : e.to);
      if ((base || b.w > 220) && !(side==='out' && other.w > 220)) { const fb = other; const same = list.filter(o => { const ob = box(side==='in' ? o.from : o.to); return Math.abs((ob.x+ob.w/2)-(fb.x+fb.w/2)) < 30; }); const j = same.indexOf(e);
        return Math.min(Math.max(fb.x+fb.w/2 + (j - (same.length-1)/2)*8, b.x+14), b.x+b.w-14); }
      const span = Math.min(b.w*0.7, k*14); return b.x + b.w/2 - span/2 + (k===1 ? span/2 : span*i/(k-1));
    };
    let out = `<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="6" fill="var(--planned)" opacity=".35"/></pattern></defs>`;
    const labels = [];
    for (const e of es) {
      const a = box(e.from), b = box(e.to);
      const horiz = Math.abs((a.y+a.h/2)-(b.y+b.h/2)) < 8;
      let d;
      if (horiz) { const y = a.y + a.h/2; const x1 = a.x + (b.x>a.x ? a.w : 0), x2 = b.x + (b.x>a.x ? 0 : b.w); d = `M${x1} ${y} L${x2} ${y}`; }
      else {
        const upward = b.y + b.h <= a.y + 2;
        const x1 = attach(a, outs[e.from], e, false, 'out'), y1 = upward ? a.y : a.y + a.h;
        const x2 = attach(b, ins[e.to], e, b.base, 'in'), y2 = upward ? b.y + b.h : b.y;
        const dy = (upward ? -1 : 1) * Math.max(18, Math.abs(y2-y1)*0.5);
        // Bend around boxes the line does not connect to, so it never reads as passing through them.
        let c1 = x1, c2 = x2;
        const obst = $$('[data-node]', map).filter(el => el.dataset.node!==e.from && el.dataset.node!==e.to && !el.classList.contains('base') && !el.classList.contains('k-product')).map(el => { const r = el.getBoundingClientRect(); return {l:r.left-mb.left-8, r:r.right-mb.left+8, t:r.top-mb.top-4, b:r.bottom-mb.top+4}; });
        const pt = (t) => { const u=1-t; return {x:u*u*u*x1+3*u*u*t*c1+3*u*t*t*c2+t*t*t*x2, y:u*u*u*y1+3*u*u*t*(y1+dy)+3*u*t*t*(y2-dy)+t*t*t*y2}; };
        for (let it=0; it<4; it++) {
          let hit = null, hp = null;
          for (const t of [.15,.25,.35,.45,.55,.65,.75,.85]) { const q = pt(t); const o = obst.find(o => q.x>o.l && q.x<o.r && q.y>o.t && q.y<o.b); if (o) { hit = o; hp = q; break; } }
          if (!hit) break;
          const goLeft = (hp.x - hit.l) < (hit.r - hp.x);
          const shift = (goLeft ? hit.l - hp.x : hit.r - hp.x) * 1.3;
          c1 = Math.min(Math.max(c1 + shift, 8), mb.width - 8); c2 = Math.min(Math.max(c2 + shift, 8), mb.width - 8);
        }
        d = `M${x1} ${y1} C${c1} ${y1+dy} ${c2} ${y2-dy} ${x2} ${y2}`;
        if (e.type==='settle' && e.label && (!narrow || (lit && lit.has(e.from) && lit.has(e.to)))) labels.push({x:(x1+x2)/2, y:(y1+y2)/2, t:e.label, e});
      }
      const on = !lit || (upS.has(e.from) && upS.has(e.to)) || (dnS.has(e.from) && dnS.has(e.to));
      const L = on && lit ? ' lit' : '';
      const planned = e.type==='settle' && sys(e.from)?.status==='planned';
      if (planned) out += `<path d="${d}" class="e e-plan-out${L}"/><path d="${d}" class="e e-plan-in${L}"/>`;
      else if (e.type==='settle') out += `<path d="${d}" class="e e-settle-out${L}"/><path d="${d}" class="e e-settle-in${L}"/>`;
      else if (e.type==='access') out += `<path d="${d}" class="e e-access${L}"/>`;
      else out += `<path d="${d}" class="e e-runs${L}"/>`;
    }
    // stubs for systems with no confirmed settlement path
    D.systems.filter(s => s.settlement_mode==='unknown' && box(s.id)).forEach(s => {
      const b = box(s.id); const x = b.x + b.w/2, y = b.y + b.h; const L = lit && lit.has(s.id) ? ' lit' : '';
      out += `<path d="M${x} ${y} L${x} ${y+16}" class="e e-unknown${L}"/><text x="${x}" y="${y+28}" text-anchor="middle" class="e-q${L}">?</text>`;
    });
    const placed = $$('.node, .base', map).map(el => { const b = el.getBoundingClientRect(); const ext = el.classList.contains('planned') && !el.classList.contains('k-product') ? 12 : 0; return {x:b.left-mb.left+b.width/2, y:b.top-mb.top+b.height/2-ext/2, w:b.width, h:b.height+ext}; });
    labels.sort((p,q)=>p.y-q.y);
    for (const l of labels) {
      const w0 = l.t.length*6.3 + 10;
      const minX = (map.querySelector('.lnodes')?.getBoundingClientRect().left || mb.left) - mb.left + w0/2 + 2; l.x = Math.max(l.x, minX);
      const x0 = l.x, y0 = l.y; const tries = [[0,0],[0,-18],[0,18],[0,-36],[0,36],[-60,0],[60,0],[-60,-18],[60,-18],[0,-54]];
      l.skip = true;
      for (const [dx,dy] of tries) { l.x = x0+dx; l.y = y0+dy; const hit = placed.some(r => Math.abs(r.x-l.x) < (r.w+w0)/2+3 && Math.abs(r.y-l.y) < ((r.h||16)+16)/2+2); if (!hit) { l.skip = false; break; } }
      if (!l.skip) placed.push({x:l.x, y:l.y, w:w0, h:16});
    }
    for (const l of labels.filter(l => !l.skip)) {
      const on = !lit || (upS.has(l.e.from) && upS.has(l.e.to)) || (dnS.has(l.e.from) && dnS.has(l.e.to));
      const w = l.t.length*6.3 + 10;
      out += `<g class="e-lab${on&&lit?' lit':''}${sys(l.e.from)?.status==='planned'?' plan':''}"><rect x="${l.x-w/2}" y="${l.y-8}" width="${w}" height="16" rx="1"/><text x="${l.x}" y="${l.y+3.5}" text-anchor="middle">${esc(l.t)}</text></g>`;
    }
    svg.setAttribute('viewBox', `0 0 ${mb.width} ${mb.height}`);
    svg.innerHTML = out;
  };
  draw(); requestAnimationFrame(draw);
  if ('ResizeObserver' in window) { ro = new ResizeObserver(() => draw()); ro.observe(map); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
}

/* ---------- clock ---------- */
function vClock(c){
  const region = c.region;
  const rows = [];
  const all = D.systems.filter(s => s.region===region && s.id!==c.root);
  const unknownCards = all.filter(s => s.settlement_mode==='unknown');
  const sysIn = all.filter(s => s.settlement_mode!=='unknown');
  if (unknownCards.length) sysIn.push({id:'cards-unknown', short:unknownCards.length>1?'Card networks':unknownCards[0].short, settlement_mode:'unknown', windows:[], names:unknownCards.map(x=>x.short)});
  const order = ['lynx','acss','interac-debit','interac-e-transfer','visanet-canada','rtr','fedwire-funds','cards-unknown'];
  sysIn.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));
  const top=40, rh=52;
  const build = (W, LW) => { const dayW=(W-LW)/7;
  const n = torontoNow(); const hol = S.holiday;
  const x = (dow, min) => LW + dow*dayW + min/1440*dayW;
  let g = `<defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2" height="6" fill="var(--planned)" opacity=".4"/></pattern></defs>`;
  // header
  const today = new Date(n.date+'T12:00:00'); const monday = new Date(today); monday.setDate(today.getDate()-n.dow);
  for (let d=0; d<7; d++){
    const dt = new Date(monday); dt.setDate(monday.getDate()+d);
    if (hol && d===0) g += `<rect x="${x(0,0)}" y="${top-6}" width="${dayW}" height="${sysIn.length*rh+6}" class="c-hol"/>`;
    g += `<text x="${x(d,0)+6}" y="16" class="c-day">${DAYS[d]}${hol&&d===0?' · holiday':''}</text><text x="${x(d,0)+6}" y="30" class="c-date">${dt.getDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][dt.getMonth()]}</text>`;
    g += `<line x1="${x(d,0)}" x2="${x(d,0)}" y1="${top-6}" y2="${top+sysIn.length*rh}" class="c-gridd"/>`;
    g += `<line x1="${x(d,720)}" x2="${x(d,720)}" y1="${top-2}" y2="${top+sysIn.length*rh}" class="c-grid"/>`;
  }
  const notes = [];
  sysIn.forEach((s,i) => {
    const y = top + i*rh, mid = y + rh/2;
    g += `<line x1="0" x2="${W}" y1="${y+rh}" y2="${y+rh}" class="c-grid"/>`;
    if (LW) g += `<text x="0" y="${mid-2}" class="c-row">${esc(s.short)}${s.status==='planned'?' ':''}</text>`;
    let sub = s.status==='planned' ? 'planned' : s.settlement_mode==='unknown' ? 'not confirmed' : s.id==='interac-e-transfer' ? 'deferred net, daily cycle' : MODE[s.settlement_mode].toLowerCase();
    if (LW) g += `<text x="0" y="${mid+12}" class="c-sub">${esc(sub)}</text>`;
    if (s.settlement_mode==='unknown') { g += `<rect x="${LW+4}" y="${mid-9}" width="430" height="16" fill="var(--paper)"/><text x="${LW+8}" y="${mid+4}" class="c-unk">Where ${esc(s.names.join(' and '))} net amounts settle in ${c.id} is not confirmed in the sources checked.</text>`; return; }
    if (s.status==='planned') {
      g += `<rect x="${x(0,0)}" y="${mid-8}" width="${7*dayW}" height="16" class="c-plan"/><rect x="${x(0,0)}" y="${mid-8}" width="${7*dayW}" height="16" class="c-plan-edge"/>`;
      g += `<rect x="${x(0,0)+4}" y="${mid-6}" width="280" height="12" fill="var(--paper)"/><text x="${x(0,0)+8}" y="${mid+3.5}" class="c-plan-t">24/7/365 exchange and settlement, once live</text>`;
      return;
    }
    if (s.id==='visanet-canada') {
      for (let d=0; d<7; d++) if (isBiz(d,hol)) g += `<rect x="${x(d,9*60)}" y="${mid-7}" width="${dayW*0.25}" height="14" class="c-settle"/><text x="${x(d,9*60)}" y="${mid-11}" class="c-settle-t">daily net</text>`;
      notes.push(`<li><b>Visa</b> settles each member's net position once a business day through Lynx, final on the value date. Visa Canada guarantees it. Time of day is not published, so the mark's position is indicative.</li>`);
      return;
    }
    if (s.id==='interac-debit') {
      for (let d=0; d<7; d++) if (isBiz(d,hol)) g += `<rect x="${x(d,6*60)}" y="${mid-7}" width="${dayW*0.25}" height="14" class="c-settle"/><text x="${x(d,6*60)}" y="${mid-11}" class="c-settle-t">via ACSS</text>`;
      notes.push(`<li><b>Interac Debit</b> payments are totalled the same day, cleared through ACSS the next day and settled on Lynx.</li>`);
      return;
    }
    if (s.id==='acss') {
      for (let d=0; d<7; d++) if (isBiz(d,hol)) { const prev = (()=>{ let k=d-1; const list=[]; while(k>=-1){ const dd=(k+7)%7; list.unshift(DAYS[dd]); if (isBiz(dd,hol) || k===d-1 && false) break; k--; if (list.length>3) break; } return list; })();
        g += `<rect x="${x(d,6*60)}" y="${mid-7}" width="${dayW*0.25}" height="14" class="c-settle"/><text x="${x(d,6*60)}" y="${mid-11}" class="c-settle-t">morning</text>`; }
      notes.push(`<li><b>ACSS</b> settles the previous business day's net balances each business morning, through Lynx.</li>`);
      return;
    }
    if (s.id==='interac-e-transfer') {
      for (let d=0; d<7; d++) g += `<line x1="${x(d,0)+3}" x2="${x(d,1440)-3}" y1="${mid-12}" y2="${mid-12}" class="c-cycle"/>`;

      // settlement days: each cycle settles on the next business day after its value date
      const settleOn = {};
      for (let d=0; d<7; d++){ let k=1; while(k<6 && !isBiz((d+k)%7,hol)) k++; const sd=(d+k)%7; (settleOn[sd] ||= []).push({d, k}); }
      for (const v of Object.values(settleOn)) v.sort((a,b)=>b.k-a.k);
      for (let d=0; d<7; d++) if (isBiz(d,hol) && settleOn[d]) {
        const fromDays = settleOn[d].map(o=>DAYS[o.d]);
        g += `<rect x="${x(d,30)}" y="${mid-4}" width="${dayW*0.3}" height="12" class="c-settle"/><text x="${x(d,30)}" y="${mid+20}" class="c-settle-t">${fromDays.length>1 ? fromDays[0]+'–'+fromDays.at(-1) : fromDays[0]} items</text>`;
      }
      notes.push(`<li><b>e-Transfer</b> feels instant to customers. Between banks it settles net the day after the value date, through Lynx. Interac says weekends and holidays can stretch this to four days. Which day each weekend cycle lands on is our reading of that rule. ${hol ? 'With Monday off, Friday to Monday all settle on Tuesday.' : 'Tick the holiday box to see the four-day gap.'}</li>`);
      return;
    }
    // open windows (Lynx, Fedwire)
    for (let d=0; d<7; d++) for (const [a,b] of openIntervals(s,d,hol)) g += `<rect x="${x(d,a)}" y="${mid-6}" width="${(b-a)/1440*dayW}" height="12" class="c-open"/>`;
    for (const w of s.windows.filter(w=>w.kind==='cutoff')) for (let d=0; d<7; d++) if (isBiz(d,hol)) g += `<line x1="${x(d,toMin(w.start))}" x2="${x(d,toMin(w.start))}" y1="${mid-6}" y2="${mid+6}" class="c-cut"/>`;
    if (s.id==='lynx') notes.push(`<li><b>Lynx</b> settles each payment as it goes, so the whole bar is final. Business days only. The white mark is 18:00, when regular payments close.</li>`);
    if (s.id==='fedwire-funds') notes.push(`<li><b>Fedwire</b> opens at 21:00 the evening before each business day. The white mark is the 18:45 third-party cutoff.</li>`);
  });
  const H = top + sysIn.length*rh + 8;
  const nx = x(n.dow, n.mins);
  g += `<line x1="${nx}" x2="${nx}" y1="${top-10}" y2="${H}" class="c-now"/><text x="${nx+4}" y="${H-2}" class="c-now-t">now</text>`;
  return {g, H, notes}; };
  const wide = build(1000,150), days = build(770,0); const notes = wide.notes, H = wide.H;
  const hol = S.holiday;
  return `<div class="section-h"><h2>When it's final</h2><p>This week in Toronto time. Accent means money is settling between institutions. A long bar settles all day, a short mark settles once.</p></div>
    <label class="toggle"><input type="checkbox" id="holiday" ${hol?'checked':''}> Monday is a statutory holiday</label>
    <div class="clockwrap"><div class="clocklabels" aria-hidden="true" style="height:${H+6}px">${sysIn.map((s,i)=>`<div style="top:${top+i*rh}px;height:${rh}px"><b>${esc(s.short)}</b></div>`).join('')}</div>
    <div class="clockbox" tabindex="0" role="img" aria-label="Weekly settlement clock for ${c.id}. ${esc(notes.map(n=>n.replace(/<[^>]+>/g,'')).join(' '))}"><svg class="clock-wide" viewBox="0 0 1000 ${H+6}">${wide.g}</svg><svg class="clock-days" width="770" height="${H+6}" viewBox="0 0 770 ${H+6}">${days.g}</svg></div></div>
    <p class="scrollhint">Scroll sideways for the full week.</p>
    <ul class="clock-notes">${notes.join('')}</ul>`;
}

/* ---------- timeline ---------- */
function vTimeline(c){
  const ev = D.timeline.filter(t => t.region===c.region); if (!ev.length) return '';
  const y0 = 2020, y1 = 2028, W = 1000, pad = 20, H = 96;
  const x = d => { const [yy,mm,dd] = d.split('-').map(Number); return pad + ((yy + (mm-1)/12 + ((dd||1)-1)/365) - y0)/(y1-y0)*(W-2*pad); };
  const n = torontoNow();
  let g = `<defs><pattern id="hatch2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="1.8" height="5" fill="var(--planned)" opacity=".5"/></pattern></defs>`;
  g += `<line x1="${pad}" x2="${W-pad}" y1="66" y2="66" class="t-axis"/>`;
  const nx0 = x(n.date);
  for (let y=y0; y<=y1; y++) { const yx = x(y+'-01-01'); g += `<line x1="${yx}" x2="${yx}" y1="62" y2="70" class="t-axis"/>${Math.abs(yx-nx0) > 30 ? `<text x="${yx}" y="88" text-anchor="middle" class="t-yr">${y}</text>` : ''}`; }
  ev.forEach((t,i) => {
    const xx = t.precision==='undated' ? W-pad-14 : x(t.date), yy = 50 - (i%3)*16;
    if (t.precision==='undated') g += `<text x="${xx-14}" y="${yy+4}" text-anchor="end" class="t-yr">no date</text>`;
    g += `<line x1="${xx}" x2="${xx}" y1="${yy+8}" y2="66" stroke="var(--rule-strong)"/>`;
    if (t.status==='done') g += `<circle cx="${xx}" cy="${yy}" r="9" class="t-done"/><text x="${xx}" y="${yy+3.5}" text-anchor="middle" class="t-n">${i+1}</text>`;
    else g += `<circle cx="${xx}" cy="${yy}" r="9" class="t-plan"/><text x="${xx}" y="${yy+3.5}" text-anchor="middle" class="t-np">${i+1}</text>`;
  });
  const nx = x(n.date);
  g += `<line x1="${nx}" x2="${nx}" y1="56" y2="76" class="t-now"/><text x="${nx}" y="88" text-anchor="middle" class="t-now-t">now</text>`;
  const fmt = t => t.precision==='quarter' ? `Q${Math.floor((+t.date.slice(5,7)-1)/3)+1} ${t.date.slice(0,4)}` : t.precision==='undated' ? 'No date' : fmtDate(t.date);
  return `<div class="section-h"><h2>What's changing</h2><p>Solid is done. Hatched is planned.</p></div>
    <div class="tlbox" aria-hidden="true"><svg viewBox="0 0 ${W} ${H+4}">${g}</svg></div>
    <ol class="tl-list">${ev.map((t,i) => `<li><span class="n${t.status==='planned'?' p':''}">${i+1}</span><span class="d">${fmt(t)}</span><span>${esc(t.text)}<span class="s">${esc(srcNames(t.sources))}</span></span></li>`).join('')}</ol>`;
}

/* ---------- panel ---------- */
function srcNames(ids){ return [...new Set((ids||[]).map(i=>IDX.sources[i]?.publisher).filter(Boolean))].join(', ').replace(/\.$/,''); }
function vPanel(n, c){
  const r = n.rec; const root = sys(c.root);
  const chain = pathDown(n.id);
  const ups = (IDX.up[n.id]||[]).map(e=>node(e.from)).filter(Boolean);
  const downId = (IDX.down[n.id]||[])[0]?.to;
  let kindLabel, facts = '', explain = '', srcIds = [], allSrc = [], today = '';
  if (n.kind==='system'){
    kindLabel = `${IDX.groups[r.group].name} · layer ${r.layer} ${IDX.layers[r.layer].name}`;
    const f = (k,v) => `<dt>${k}</dt><dd${k==='Settles in'?' class="acc"':''}>${v}</dd>`;
    const unk = '<span class="unk">Not confirmed</span>';
    facts = f('Operator', esc(party(r.operator).name)) +
      f('Participants', esc(r.participants_count || r.participants_summary) || unk) +
      f('Settlement asset', esc(r.settlement_asset) || unk) +
      f('Hours', esc(r.hours) || unk) +
      f(r.status==='planned' ? 'Will settle in' : 'Settles in', r.settlement_mode==='none' ? 'Does not settle' : r.settles_in ? esc(sys(r.settles_in).name) : r.settlement_mode==='unknown' ? unk : 'Final here');
    explain = r.explainer; srcIds = r.field_sources.explainer; allSrc = [...new Set(Object.values(r.field_sources).flat())];
    if ((r.windows||[]).some(w=>w.kind==='open')) { const nn = torontoNow(); today = `<div class="today"><div class="ph"><span>Today</span><span>${esc(openStatus(r).text)}</span></div>${day24(r, nn.dow, false, true)}<div class="hrs"><span>00:00</span><span>06</span><span>12</span><span>18</span><span>24:00</span></div></div>`; }
  } else if (n.kind==='product'){
    kindLabel = 'Payment type';
    const targets = [r.runs_on].flat().map(t=>sys(t));
    const fin = finality(n.id); const endsAt = pathDown(n.id).at(-1).id===root.id;
    const via = pathDown(n.id).slice(2,-1).map(x=>node(x.id).short);
    facts = `<dt>What it is</dt><dd>${esc(r.plain)}</dd><dt>Runs on</dt><dd>${targets.map(t=>esc(t.name)).join(', ')}</dd><dt>Final between banks</dt><dd>${esc(fin.t.charAt(0).toUpperCase()+fin.t.slice(1))}</dd><dt>Settles in</dt><dd${endsAt?' class="acc"':''}>${endsAt ? esc(root.name)+(via.length?` <span class="muted" style="font-weight:400">via ${esc(via.join(' and '))}</span>`:'') : '<span class="unk">Not confirmed</span>'}</dd>`;
    const ch = pathDown(n.id); const ends = ch.at(-1).id===root.id;
    explain = `${r.name} runs on ${targets.map(t=>t.name).join(' and ')}. ${ends ? `The banks involved settle what they owe each other in ${root.name}.` : 'Where the banks settle what they owe each other is not confirmed in the sources checked.'}`;
    srcIds = r.sources; allSrc = r.sources;
  } else {
    kindLabel = `Layer ${r.layer} · ${IDX.layers[r.layer].name}`;
    facts = `<dt>Who</dt><dd>${esc(party(r.party).name)}</dd>${r.holds_account_at?`<dt>Account at</dt><dd class="acc">${esc(sys(r.holds_account_at).name)}</dd>`:''}${r.through?`<dt>Access</dt><dd>Through ${esc(node(r.through).name.toLowerCase())}</dd>`:''}<dt>Uses</dt><dd>${r.uses.map(u=>esc(sys(u).short)).join(', ')}</dd>`;
    explain = r.summary; srcIds = r.sources; allSrc = r.sources;
  }
  const ladder = chain.map((x,i) => { const nd = node(x.id); const next = chain[i+1];
    const isRoot = x.id===root.id;
    let how = '';
    if (next) { const e = next.via; how = e.type==='runs' ? 'runs on' : e.type==='access' ? 'holds an account at' : `settles ${e.label || MODE[nd.rec.settlement_mode].toLowerCase()}`; }
    else if (isRoot) how = `Final · ${root.settlement_asset}`;
    else if (nd.kind==='system' && nd.rec.settlement_mode==='unknown') how = 'settlement path not confirmed';
    const kcls = next && next.via.type==='runs' ? ' k-runs' : next && nd.kind==='system' && nd.rec.status==='planned' ? ' k-plan' : '';
    return `<li class="rung${i===0?' cur':''}${isRoot?' root':''}${kcls}"><span class="rl" aria-hidden="true"></span><div class="rb">${i===0?`<b>${esc(nd.name)}</b>`:`<button type="button" data-node="${x.id}">${esc(nd.name)}</button>`}<span class="how">${esc(how)}</span></div></li>`;
  }).join('');
  const multi = n.kind==='product' && [r.runs_on].flat().length>1 ? `<p class="src">Also runs on ${[r.runs_on].flat().slice(1).map(t=>esc(sys(t).name)).join(', ')}.</p>` : '';
  const flows = IDX.flowsFor[n.id] || (n.kind==='product' ? [r.runs_on].flat().flatMap(t => IDX.flowsFor[t]||[]) : []);
  const srcRows = D.sources.filter(s=>allSrc.includes(s.id)).map(s => {
    const fields = n.kind==='system' ? Object.entries(r.field_sources).filter(([,v])=>v.includes(s.id)).map(([k])=>k.replace(/_/g,' ')).join(', ') : 'this record';
    return `<li><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.title)}</a><span class="mono">${esc(s.tier)} · ${s.published?'dated '+esc(s.published)+' · ':''}checked ${esc(s.accessed)} · supports ${esc(fields)}</span></li>`; }).join('');
  const caveats = n.kind==='system' ? r.caveats : [], unknowns = n.kind==='system' ? r.unknowns : [];
  const icon = n.kind==='system' ? logo(party(r.operator).logo) : '';
  return `<aside class="panel${S.full?' full':''}" id="panel" aria-labelledby="ptitle" role="region">
    <div class="pbar"><button class="btn grip" type="button" id="sheet" aria-expanded="${S.full}">${S.full?'Half height':'Full height'}</button><span></span><button class="btn" type="button" id="pclose">Close</button></div>
    <p class="ptype">${esc(kindLabel)}</p>
    <h2 id="ptitle" tabindex="-1">${icon}${esc(n.name)}${r.status==='planned'?' <span class="tag">planned</span>':''}</h2>
    <dl class="facts">${facts}</dl>
    <p class="explain">${esc(explain)}</p>
    <p class="src">Source: ${esc(srcNames(srcIds))}.${n.kind==='system'?' Checked '+fmtDate(r.last_checked)+'.':''}</p>
    <div class="ph"><span>Settlement path</span><span>${n.id===root.id ? 'this is where it ends' : (chain.at(-1).id===root.id ? (chain.length-1)+' step'+(chain.length===2?'':'s')+' to the central bank' : 'path not confirmed')}</span></div>
    <ol class="ladder">${ladder}</ol>${multi}
    <div class="drillrow">
      <button class="btn strong" type="button" data-node="${downId||''}" ${downId?'':'disabled'}>↓ Drill down</button>
      <button class="btn" type="button" id="drillup" ${ups.length?'':'disabled'} aria-expanded="false" aria-controls="feeders">↑ Settles here (${ups.length})</button>
    </div>
    <ul class="feeders" id="feeders" hidden>${ups.map(u => `<li><button type="button" data-node="${u.id}"><b>${esc(u.name)}</b><span class="mono muted">${u.kind==='product'?'runs on':u.kind==='access'?'account':esc(u.rec.settles_label||MODE[u.rec.settlement_mode])}</span></button></li>`).join('')}</ul>
    ${today}
    ${flows.length ? `<a class="flowlink" href="${href({view:'flow',flow:flows[0],step:1,node:null})}" data-flow="${flows[0]}">Show the flow →</a>` : ''}
    ${n.kind==='system' ? `<details><summary>Rulebook and operator</summary><div><p>Operated by ${esc(party(r.operator).name)}. Rules set by ${r.scheme_owner ? esc(party(r.scheme_owner).name) : 'no separate rule owner'}.</p><p class="mono muted">Roles: ${r.roles.map(esc).join(', ')} · ${esc(MODE[r.settlement_mode])}</p></div></details>
      <details><summary>Participants</summary><div><p>${esc(r.participants_summary||'Not confirmed.')}</p>${r.participants_count?`<p>${esc(r.participants_count)}</p>`:''}</div></details>` : ''}
    ${n.kind==='product' ? (() => { const steps = pathDown(n.id).map(x=>node(x.id)).filter(x=>x.kind==='system'); const lc = steps.map(x=>x.rec.last_checked).sort()[0];
      return `<details><summary>Who runs each step</summary><div><ul>${steps.map(x=>`<li><b>${esc(x.rec.short)}</b>. Operated by ${esc(party(x.rec.operator).name)}${x.rec.scheme_owner && x.rec.scheme_owner!==x.rec.operator ? ', rules by '+esc(party(x.rec.scheme_owner).name) : ''}. ${esc(MODE[x.rec.settlement_mode])}${x.rec.settlement_timing?', '+esc(x.rec.settlement_timing.charAt(0).toLowerCase()+x.rec.settlement_timing.slice(1)):''}.</li>`).join('')}</ul><p class="mono muted">Path last checked ${esc(lc||'')}</p></div></details>`; })() : ''}
    ${caveats.length ? `<details><summary>Caveats</summary><div><ul>${caveats.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></details>` : ''}
    ${unknowns.length ? `<details><summary>Not known yet</summary><div><ul>${unknowns.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></details>` : ''}
    <details><summary>All sources</summary><div><ul class="srcs">${srcRows}</ul></div></details>
  </aside>`;
}

/* ---------- Railroom ---------- */
function vFlow(){
  const sc = IDX.scenarios[S.flow]; const st = sc.steps[S.step-1]; const rail = sys(sc.rail);
  const lineName = {message:'Message', money:'Money movement', settlement:'Settlement', customer:'Customer'};
  const ccy = IDX.ccyByRegion[rail.region];
  return crumbs([HOME, {label:'Railroom'}, {label:esc(sc.title)}]) +
   `${D.scenarios.length>1 ? `<nav class="flowtabs" aria-label="Flows">${D.scenarios.map(x => `<a href="${href({flow:x.id,step:1})}" data-flow="${x.id}"${x.id===sc.id?' aria-current="page"':''}>${esc(x.title)}</a>`).join('')}</nav>` : ''}
    <div class="flow-head"><h1>${esc(sc.title)}</h1><span class="mono muted">Rail <a style="font-weight:700" href="${href({view:'ccy',ccy:ccy.id,node:rail.id})}" data-go='{"view":"ccy","ccy":"${ccy.id}","node":"${rail.id}"}'>${esc(rail.name)}</a></span></div>
    <p class="lede">${esc(sc.summary)} Dashed line is a message. Solid line is money moving on a bank's books. Double line into the last column is final settlement in central bank money.</p>
    <div class="diagram" role="img" aria-label="Sequence diagram with ${sc.steps.length} steps. The steps are listed in text below.">${svgFlow(sc)}</div>
    <div class="controls">
      <button class="btn strong" type="button" id="prev" ${S.step===1?'disabled':''}>← Previous</button>
      <button class="btn strong" type="button" id="next" ${S.step===sc.steps.length?'disabled':''}>Next →</button>
      <label class="scrub"><span class="mono muted">Step ${S.step} of ${sc.steps.length} · ${esc(st.phase)} · ${esc(st.timing)}</span>
        <input type="range" id="scrub" min="1" max="${sc.steps.length}" value="${S.step}" aria-label="Step">
        <span class="marks" aria-hidden="true">${['authorization','clearing','settlement'].map(ph => { const i = sc.steps.findIndex(x=>x.phase===ph); const pct = i/(sc.steps.length-1)*100; return i<0 ? '' : `<span style="left:${pct}%;${pct>85?'transform:translateX(-100%)':''}">${ph}</span>`; }).join('')}</span></label>
    </div>
    <p class="caption" aria-live="polite"><span class="mono">${S.step}. ${esc(lineName[st.type])}</span>${esc(st.caption)}</p>
    <div class="four">${[['messaging','Messaging'],['money','Money movement'],['settlement','Settlement'],['customer','Customer sees']].map(([k,l]) => `<div><h3${k==='settlement'?' class="acc"':''}>${l}</h3><p>${esc(sc.explainer[k].text)}</p><p class="src" style="margin:0">${esc(srcNames(sc.explainer[k].sources))}</p></div>`).join('')}</div>
    <div class="ph"><span>Steps in text</span></div>
    <ol class="steps-text">${sc.steps.map(x => `<li${x.n===S.step?' aria-current="step"':''}>${esc(x.caption)} <span class="mono">${esc(lineName[x.type])} · ${esc(x.timing)} · ${esc(srcNames(x.sources))}</span></li>`).join('')}</ol>
    <details><summary>Caveats</summary><div><ul>${sc.caveats.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div></details>`;
}
function svgFlow(sc){
  const lanes = [...sc.lanes, sc.settlement_lane];
  const colW = 128, left = 34, top = 54, rowH = 56, w = left + lanes.length*colW + 10, h = top + sc.steps.length*rowH + 14;
  const x = id => left + lanes.indexOf(id)*colW + colW/2, settleX = x(sc.settlement_lane);
  let g = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg"><defs>
    <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker>
    <marker id="m-fill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs>`;
  lanes.forEach(id => { const cx = x(id), st = id===sc.settlement_lane; const p = party(id);
    const words = p.name.replace(/\s*\(.*\)/,'').split(' '); const l1=[], l2=[]; words.forEach(wd => ((l1.join(' ').length+wd.length<15) && !l2.length ? l1 : l2).push(wd));
    const ctry = p.country==='CA' ? 'ca' : p.country==='US' ? 'us' : null;
    g += `<text class="lane-label${st?' settle':''}" x="${cx}" y="18" text-anchor="middle">${esc(st?'Settlement':l1.join(' '))}</text><text class="lane-label${st?' settle':''}" x="${cx}" y="33" text-anchor="middle">${esc(st?p.name:l2.join(' '))}</text>`;
    if (ctry && !st) g += `<g transform="translate(${cx-8} 38) scale(.025)">${ICONS.flag[ctry].replace(/^<svg[^>]*>|<\/svg>$/g,'')}</g>`;
    g += `<line class="lane-rule${st?' settle':''}" x1="${cx}" x2="${cx}" y1="${top-4}" y2="${h-6}"/>`; });
  sc.steps.forEach((st,i) => { const y = top + i*rowH + 22, on = st.n===S.step ? ' on' : ''; const fx = x(st.from), tx = x(st.to);
    g += `<g class="step${on}" data-step="${st.n}"><rect x="0" y="${y-22}" width="${w}" height="${rowH}" fill="transparent"/><text class="step-num" x="4" y="${y+4}">${st.n}</text>`;
    if (st.type==='customer') g += `<text class="lbl" x="${fx}" y="${y+4}" text-anchor="middle">${st.n===1?'asks to pay':'sees credit'}</text>`;
    else if (st.from===st.to) g += `<line class="ln" x1="${fx-26}" x2="${fx+26}" y1="${y}" y2="${y}" stroke-width="2.5"/><text class="lbl" x="${fx}" y="${y+16}" text-anchor="middle">book entry</text>`;
    else if (st.type==='message') { g += `<line class="ln" x1="${fx}" x2="${tx-4}" y1="${y}" y2="${y}" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#m-open)"/>`; if (st.via) g += `<text class="lbl" x="${x(st.via)}" y="${y-7}" text-anchor="middle">${esc(party(st.via)?.name||sys(st.via)?.short)}</text>`; }
    else if (st.type==='money') g += `<line class="ln" x1="${fx}" x2="${tx+(tx>fx?-6:6)}" y1="${y}" y2="${y}" stroke-width="2.5" marker-end="url(#m-fill)"/><text class="lbl" x="${(fx+tx)/2}" y="${y-7}" text-anchor="middle">credit</text>`;
    else if (st.type==='settlement') { for (const off of [-2.5,2.5]) { g += `<line class="ln settle" x1="${fx}" x2="${settleX}" y1="${y-8+off}" y2="${y-8+off}" stroke-width="1.6"/><line class="ln settle" x1="${settleX}" x2="${tx}" y1="${y+10+off}" y2="${y+10+off}" stroke-width="1.6"/>`; }
      g += `<line class="ln settle" x1="${settleX}" x2="${settleX}" y1="${y-14}" y2="${y+16}" stroke-width="2.5"/><text class="lbl" x="${(fx+settleX)/2}" y="${y-15}" text-anchor="middle">${esc(sys(st.via)?.short||'')}</text><text class="lbl final" x="${settleX+6}" y="${y+4}">final</text><text class="lbl" x="${fx+8}" y="${y-14}">debit</text><text class="lbl" x="${(tx+settleX)/2}" y="${y+30}" text-anchor="middle">credit</text>`; }
    g += `</g>`; });
  return g + '</svg>';
}

/* ---------- events ---------- */
function openNode(id){
  if (!id || !node(id)) return;
  if (!S.node) lastFocus = id;
  const n = node(id); const c = IDX.ccyByRegion[n.region];
  go({view:'ccy', ccy:c.id, node:id, flow:null, type:null}, {focus:true});
}
function placeClockLabels(){
  const cb = $('.clockbox'), cl = $('.clocklabels'); if (!cb || !cl) return;
  const svg = cb.querySelector('svg'); const sc = svg.getBoundingClientRect().width / 1000;
  const sync = () => { const on = cb.scrollWidth > cb.clientWidth + 2 && cb.scrollLeft > 20; cl.classList.toggle('on', on); };
  $$('div', cl).forEach(d => { d.style.top = (+d.dataset.y*sc)+'px'; d.style.height = (+d.dataset.h*sc)+'px'; d.style.width = Math.max(70, 110*sc)+'px'; });
  cb.addEventListener('scroll', sync, {passive:true}); requestAnimationFrame(sync);
}
// On phones the record opens as a bottom sheet, so bring the selected item into the strip above it.
function bringSelectedIntoView(){
  if (!window.matchMedia('(max-width: 900px)').matches || !S.node) return;
  const el = document.querySelector(`.map [data-node="${CSS.escape(S.node)}"]`);
  if (el) window.scrollTo({top: Math.max(0, el.getBoundingClientRect().top + window.scrollY - 64), behavior:'auto'});
}
function closePanel(){ const id = S.node; go({node:null, full:false}); const el = document.querySelector(`.map [data-node="${CSS.escape(lastFocus||id)}"]`); el && el.focus(); }
function wire(){
  const app = $('#app');
  $$('[data-go]', app).forEach(a => a.addEventListener('click', e => { e.preventDefault(); go(JSON.parse(a.dataset.go)); }));
  $$('[data-node]', app).forEach(b => b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); const id=b.dataset.node; if (!id) return; if (b.closest('.map') && S.node===id) closePanel(); else openNode(id); }));
  $$('[data-open-ccy]', app).forEach(b => b.addEventListener('click', () => openNode(b.dataset.node)));
  $$('[data-flow]', app).forEach(a => a.addEventListener('click', e => { e.preventDefault(); go({view:'flow', flow:a.dataset.flow, step:1, node:null}); }));
  $('#pclose')?.addEventListener('click', closePanel);
  $('#sheet')?.addEventListener('click', () => { S.full=!S.full; $('#panel').classList.toggle('full',S.full); const b=$('#sheet'); b.setAttribute('aria-expanded',S.full); b.textContent=S.full?'Half height':'Full height'; });
  $('#drillup')?.addEventListener('click', e => { const f=$('#feeders'); f.hidden=!f.hidden; e.currentTarget.setAttribute('aria-expanded', !f.hidden); if(!f.hidden) f.querySelector('button')?.focus(); });
  $('#holiday')?.addEventListener('change', e => { S.holiday = e.target.checked; render(); $('#holiday')?.focus(); });
  if (S.view==='flow'){
    const n = IDX.scenarios[S.flow].steps.length;
    const set = k => go({step:Math.min(n,Math.max(1,k))}, {replace:true});
    $('#prev').addEventListener('click', () => { set(S.step-1); $('#prev')?.focus(); });
    $('#next').addEventListener('click', () => { set(S.step+1); (S.step===n?$('#prev'):$('#next'))?.focus(); });
    $('#scrub').addEventListener('input', e => { set(+e.target.value); $('#scrub')?.focus(); });
    $$('.step', app).forEach(g => g.addEventListener('click', () => set(+g.dataset.step)));
  }
}
document.addEventListener('keydown', e => {
  if (e.key==='Escape' && S.node){ e.preventDefault(); closePanel(); return; }
  if (S.view==='flow' && (e.key==='ArrowRight'||e.key==='ArrowLeft') && !e.target.matches('input')){ e.preventDefault(); const n=IDX.scenarios[S.flow].steps.length; go({step:Math.min(n,Math.max(1,S.step+(e.key==='ArrowRight'?1:-1)))},{replace:true}); }
});
$$('header [data-nav]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); if (a.dataset.nav==='flow') go({view:'flow', flow:D.scenarios[0].id, step:1, node:null}); else go({view:'home', ccy:null, node:null, type:null, flow:null}); }));

load().then(d => { D=d; build(); S=fromURL(); render(); if (S.node) { $('#ptitle')?.focus({preventScroll:true}); bringSelectedIntoView(); } })
  .catch(err => { $('#app').innerHTML = `<div class="err"><strong>The atlas data did not load.</strong> ${esc(err.message)}. Serve the repo root with a local web server (for example <span class="mono">npx serve .</span>) and open /prototype/canada/.</div>`; console.error(err); });
})();
</script>
<!--/page-->
