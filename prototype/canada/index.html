<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<!--page-->
<title>Settlement Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;700&family=Atkinson+Hyperlegible+Next:wght@400;700&display=swap">
<style>
/* Layout: a reference ledger. Rows on the left, one record panel on the right (bottom sheet on phones).
   Two drill axes. Across: World > group > region > system. Down: system > where it settles > central bank. */
:root{
  --paper:#F3F3EF; --ink:#1B1B1B; --muted:#5A564F; --rule:#D3CCC0; --rule-strong:#8A8378;
  --accent:#8C1D3A; --accent-soft:#EFE2E4; --planned:#6A5418;
  --read:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",-apple-system,"Segoe UI",Roboto,sans-serif;
  --code:"Atkinson Hyperlegible Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --s1:13px; --s2:16px; --s3:18px; --s4:22px; --s5:30px;
  --line-message:1px; --line-money:2.5px; --line-settlement:2.5px; --dash-message:4 3;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#16171A; --ink:#ECE8E1; --muted:#A9A398; --rule:#34363B; --rule-strong:#7D7A74;
  --accent:#EE9AAE; --accent-soft:#2C1E22; --planned:#D9B865; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#16171A; --ink:#ECE8E1; --muted:#A9A398; --rule:#34363B; --rule-strong:#7D7A74;
  --accent:#EE9AAE; --accent-soft:#2C1E22; --planned:#D9B865; color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 var(--s2)/1.55 var(--read);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.code{font-family:var(--code);font-size:var(--s1);letter-spacing:.01em}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--rule-strong);
  display:flex;flex-wrap:wrap;gap:8px 24px;align-items:baseline;justify-content:space-between;padding-block:14px 10px}
.mark{font-weight:700;font-size:var(--s3);letter-spacing:-.01em;text-decoration:none}
.mark small{font-weight:400;font-size:var(--s1);color:var(--muted);margin-left:8px;letter-spacing:.04em}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav a{padding:6px 10px;text-decoration:none;font-size:var(--s1);font-family:var(--code);border-bottom:2px solid transparent}
.nav a[aria-current="page"]{border-bottom-color:var(--ink);font-weight:700}

.crumbs{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;padding-block:14px 4px;font-size:var(--s1);font-family:var(--code)}
.crumbs a{text-decoration:none;color:var(--muted)}
.crumbs a:hover{color:var(--ink);text-decoration:underline}
.crumbs [aria-current]{color:var(--ink);font-weight:700}
.crumbs .sep{color:var(--rule-strong)}

.regions{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-block:6px 18px;font-size:var(--s1)}
.regions span{color:var(--muted);margin-right:4px}
.chip{border:1px solid var(--rule-strong);background:none;padding:3px 10px;border-radius:2px;cursor:pointer;font-family:var(--code);font-size:var(--s1)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* body split */
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:0 40px;padding-bottom:64px}
.split.has-panel{grid-template-columns:minmax(0,1fr) minmax(0,440px)}
.list{min-width:0}
h1{font-size:var(--s5);line-height:1.15;letter-spacing:-.02em;margin:0 0 6px;text-wrap:balance;font-weight:700}
.lede{max-width:64ch;margin:0 0 24px;color:var(--muted)}

/* L1 rows */
.rows{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule-strong)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 24px;align-items:baseline;padding:14px 4px;border-bottom:1px solid var(--rule);text-decoration:none}
.row:hover .row-name,.row:focus-visible .row-name{text-decoration:underline}
.row-name{font-size:var(--s3);font-weight:700}
.row-def{grid-column:1;color:var(--muted);max-width:64ch;font-size:var(--s2)}
.row-count{grid-row:1/span 2;grid-column:2;text-align:right;font-family:var(--code);font-size:var(--s1);white-space:nowrap}
.row.empty .row-name{font-weight:400;color:var(--muted)}

/* L2 table */
.tablebox{overflow-x:auto;border-top:1px solid var(--rule-strong)}
table{border-collapse:collapse;width:100%;font-size:var(--s2)}
th{font-family:var(--code);font-size:var(--s1);font-weight:400;color:var(--muted);text-align:left;padding:10px 12px 8px 0;border-bottom:1px solid var(--rule-strong);white-space:nowrap}
td{padding:12px 12px 12px 0;border-bottom:1px solid var(--rule);vertical-align:baseline}
tbody tr{cursor:pointer}
tbody tr:hover td{background:color-mix(in srgb,var(--accent-soft) 60%,transparent)}
tbody tr[aria-selected="true"] td{background:var(--accent-soft)}
td.sys button{all:unset;cursor:pointer;font-weight:700}
td.sys button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.cc{font-family:var(--code);font-size:11px;border:1px solid var(--rule-strong);padding:0 4px;margin-right:8px;vertical-align:2px;color:var(--muted)}
.st-planned{font-family:var(--code);font-size:var(--s1);color:var(--planned);margin-left:6px}
.settle-link{color:var(--accent);text-decoration:none;font-weight:700}
.settle-link:hover{text-decoration:underline}
.unknown{color:var(--muted);font-style:italic}
.group-head{font-size:var(--s3);margin:28px 0 8px;font-weight:700}

/* L3 panel */
.panel{min-width:0;border-left:1px solid var(--rule-strong);padding:4px 0 0 28px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto}
.panel-bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.panel-bar .grip{display:none}
.icon-btn{border:1px solid var(--rule-strong);background:none;border-radius:2px;padding:4px 10px;cursor:pointer;font-family:var(--code);font-size:var(--s1)}
h2[tabindex="-1"]:focus:not(:focus-visible){outline:none}
.panel h2{font-size:var(--s4);line-height:1.2;margin:0 0 2px;letter-spacing:-.01em}
.panel .kind{font-family:var(--code);font-size:var(--s1);color:var(--muted);margin:0 0 14px}
dl.facts{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 16px;margin:0 0 16px;padding:12px 0;border-block:1px solid var(--rule)}
dl.facts dt{font-family:var(--code);font-size:var(--s1);color:var(--muted);padding-top:2px}
dl.facts dd{margin:0}
dl.facts .settles dd{color:var(--accent);font-weight:700}
.explain{max-width:60ch;margin:0 0 8px}
.srcline{font-size:var(--s1);color:var(--muted);margin:0 0 20px}
.srcline a{color:var(--muted)}

/* settlement drill */
.drill{margin:0 0 20px}
.drill h3,.panel h3{font-size:var(--s1);font-family:var(--code);font-weight:700;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px}
.ladder{list-style:none;margin:0;padding:0}
.rung{display:grid;grid-template-columns:18px minmax(0,1fr);gap:0 10px}
.rung .rail{position:relative}
.rung .rail::before{content:"";position:absolute;left:8px;top:0;bottom:0;border-left:var(--line-settlement) double var(--accent);width:0}
.rung:last-child .rail::before{bottom:auto;height:14px}
.rung:first-child .rail::before{top:14px}
.rung .rail::after{content:"";position:absolute;left:3px;top:8px;width:12px;height:12px;border:2px solid var(--accent);background:var(--paper);border-radius:50%}
.rung.here .rail::after{background:var(--accent)}
.rung .body{padding:4px 0 14px}
.rung button.to{all:unset;cursor:pointer;font-weight:700}
.rung button.to:hover{text-decoration:underline}
.rung button.to:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.rung .how{display:block;font-family:var(--code);font-size:var(--s1);color:var(--muted)}
.rung.terminal .how{color:var(--accent)}
.drill-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.drill-btns button{border:1px solid var(--ink);background:none;border-radius:2px;padding:6px 12px;cursor:pointer;font-size:var(--s1);font-family:var(--code)}
.drill-btns button:disabled{border-color:var(--rule);color:var(--muted);cursor:default}
.feeders{list-style:none;margin:8px 0 0;padding:0;border-top:1px solid var(--rule)}
.feeders li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;padding:8px 0;border-bottom:1px solid var(--rule)}
.feeders button{all:unset;cursor:pointer;font-weight:700}
.feeders button:hover{text-decoration:underline}
.feeders button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.flowlink{display:inline-block;margin:0 0 20px;color:var(--accent);font-weight:700;text-decoration:none}
.flowlink:hover{text-decoration:underline}

/* L4 disclosure */
details{border-top:1px solid var(--rule)}
details:last-of-type{border-bottom:1px solid var(--rule)}
summary{cursor:pointer;padding:10px 0;font-weight:700;list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-family:var(--code);color:var(--muted)}
details[open] summary::after{content:"−"}
details > div{padding:0 0 14px;font-size:var(--s2)}
details ul{margin:0;padding-left:18px}
details li{margin:0 0 6px}
.srclist{list-style:none;padding:0}
.srclist li{margin:0 0 10px}
.srclist .code{color:var(--muted);display:block}

/* Railroom */
.flow-head{display:flex;flex-wrap:wrap;gap:6px 24px;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.diagram{overflow-x:auto;border-block:1px solid var(--rule-strong);margin:0 0 16px;position:relative}
.diagram svg{display:block}
.lane-label{font:700 12px var(--read);fill:var(--ink)}
.lane-label.settle{fill:var(--accent)}
.step-num{font:700 12px var(--code);fill:var(--muted)}
.step-cap{font:400 12px var(--read);fill:var(--muted)}
.step.on .step-num,.step.on .step-cap{fill:var(--ink)}
.step .ln{stroke:var(--rule-strong)}
.step.on .ln{stroke:var(--ink)}
.step.on .ln.settle,.step .ln.settle{stroke:var(--accent)}
.step:not(.on) .ln.settle{opacity:.55}
.step .lbl{font:700 11px var(--code);fill:var(--muted)}
.step.on .lbl{fill:var(--ink)}
.step .lbl.final{fill:var(--accent)}
.lane-rule{stroke:var(--rule)}
.lane-rule.settle{stroke:var(--accent);stroke-dasharray:2 3}
.controls{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 8px}
.controls button{border:1px solid var(--ink);background:none;border-radius:2px;padding:6px 14px;cursor:pointer;font-family:var(--code);font-size:var(--s1)}
.controls button:disabled{border-color:var(--rule);color:var(--muted);cursor:default}
.scrub{flex:1;min-width:200px;display:grid;gap:4px}
.scrub input{width:100%;accent-color:var(--accent)}
.marks{display:flex;justify-content:space-between;font-family:var(--code);font-size:11px;color:var(--muted)}
.caption{min-height:3.2em;max-width:70ch;font-size:var(--s3);margin:4px 0 18px}
.caption .code{display:block;color:var(--muted)}
.legend-inline{font-size:var(--s1);color:var(--muted);margin:0 0 20px;max-width:80ch}
.four{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:0 28px;border-top:1px solid var(--rule-strong);margin:8px 0 20px}
.four div{padding:12px 0;border-bottom:1px solid var(--rule)}
.four h3{margin:0 0 4px;font-size:var(--s1);font-family:var(--code);text-transform:uppercase;letter-spacing:.08em}
.four h3.settle{color:var(--accent)}
.four p{margin:0 0 4px}
.steps-text{padding-left:22px;max-width:72ch}
.steps-text li{margin:0 0 8px;color:var(--muted)}
.steps-text li[aria-current="step"]{color:var(--ink);font-weight:700}
.steps-text .code{font-weight:400}
.foot{border-top:1px solid var(--rule);padding-block:14px 28px;font-size:var(--s1);color:var(--muted)}
.err{border:1px solid var(--accent);padding:12px;margin:20px 0}

/* phones: panel becomes a bottom sheet */
@media (max-width: 820px){
  .split.has-panel{grid-template-columns:minmax(0,1fr)}
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:8;max-height:none;height:56vh;border-left:0;border-top:1px solid var(--rule-strong);
    background:var(--paper);padding:8px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
    box-shadow:0 -1px 0 var(--rule-strong);overflow:auto}
  .panel.full{height:calc(100vh - 56px - env(safe-area-inset-top,0px))}
  .panel-bar{position:sticky;top:-8px;background:var(--paper);padding:6px 0 8px;margin-top:-8px}
  .panel-bar .grip{display:inline-block}
  .split.has-panel .list{padding-bottom:58vh}
  .row{grid-template-columns:minmax(0,1fr)}
  .row-count{grid-row:auto;grid-column:1;text-align:left}
  h1{font-size:26px}
  /* L2 table becomes stacked rows so nothing is hidden */
  table.stack thead{position:absolute;left:-9999px}
  table.stack, table.stack tbody, table.stack tr, table.stack td{display:block;width:100%}
  table.stack tr{border-bottom:1px solid var(--rule);padding:10px 0}
  table.stack td{border:0;padding:2px 0}
  table.stack td[data-label]::before{content:attr(data-label);display:inline-block;min-width:92px;font-family:var(--code);font-size:var(--s1);color:var(--muted)}
}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>

<header class="top wrap">
  <a class="mark" href="#" data-nav="home">Settlement Map<small>Fintech North</small></a>
  <nav class="nav" aria-label="Sections">
    <a href="#" data-nav="home" id="nav-atlas">Atlas</a>
    <a href="#flow-ca-us-wire" data-nav="flow" id="nav-flow">Railroom</a>
  </nav>
</header>
<main class="wrap" id="app" aria-live="polite"><p class="muted">Loading the atlas data.</p></main>
<footer class="wrap foot" id="foot"></footer>

<script type="application/json" id="atlas-inline"></script>
<script>
(function(){
'use strict';
const INLINE = document.getElementById('atlas-inline').textContent.trim();
const HASH_ONLY = !!INLINE; // the published preview only carries #name in its link
let D, IDX = {}, state = {view:'home', group:null, region:'ALL', system:null, flow:null, step:1, sheetFull:false};
let lastRowFocus = null;

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = (s, r=document) => r.querySelector(s);
const fmtDate = d => { const m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec']; const [y,mo,da]=d.split('-'); return `${+da} ${m[+mo-1]} ${y}`; };
const MODE = {
  'rtgs':'Real-time gross', 'deferred-net':'Deferred net', 'real-time-funded':'Real time, funded account',
  'central-bank-ledger':'Central bank ledger', 'pvp':'Payment versus payment', 'on-chain':'On-chain', 'none':'Does not settle', 'unknown':'Not confirmed'
};

async function load(){
  if (INLINE) return JSON.parse(INLINE);
  const r = await fetch('../../data/atlas.json', {cache:'no-store'});
  if (!r.ok) throw new Error('data/atlas.json returned ' + r.status);
  return r.json();
}

function index(){
  for (const k of ['groups','regions','parties','systems','scenarios','sources']) IDX[k] = Object.fromEntries(D[k].map(x => [x.id, x]));
  IDX.feeders = {};
  for (const s of D.systems) if (s.settles_in) (IDX.feeders[s.settles_in] ||= []).push(s.id);
  IDX.flowsFor = {};
  for (const sc of D.scenarios){
    const ids = new Set([sc.rail]); sc.steps.forEach(st => st.via && IDX.systems[st.via] && ids.add(st.via));
    ids.forEach(id => (IDX.flowsFor[id] ||= []).push(sc.id));
  }
}
const sys = id => IDX.systems[id];
const party = id => IDX.parties[id];
const inRegion = s => state.region === 'ALL' || s.region === state.region;
const chain = id => { const out=[]; let c=sys(id); const seen=new Set(); while(c && !seen.has(c.id)){ out.push(c); seen.add(c.id); c = c.settles_in ? sys(c.settles_in) : null; } return out; };

/* ---------- routing ---------- */
function toURL(){
  if (HASH_ONLY){
    let h = '';
    if (state.view==='flow') h = 'flow-' + state.flow + (state.step>1 ? '-step' + state.step : '');
    else if (state.system) h = state.system;
    else if (state.group) h = 'group-' + state.group + (state.region!=='ALL' ? '-in-' + state.region.toLowerCase() : '');
    else if (state.region!=='ALL') h = 'region-' + state.region.toLowerCase();
    return h ? '#' + h : location.pathname + location.search;
  }
  const p = new URLSearchParams();
  if (state.view==='flow'){ p.set('flow', state.flow); if (state.step>1) p.set('step', state.step); }
  else { if (state.group) p.set('group', state.group); if (state.region!=='ALL') p.set('region', state.region); if (state.system) p.set('system', state.system); }
  const q = p.toString(); return location.pathname + (q ? '?' + q : '');
}
function fromURL(){
  const s = {view:'home', group:null, region:'ALL', system:null, flow:null, step:1, sheetFull:false};
  if (HASH_ONLY){
    const h = decodeURIComponent(location.hash.slice(1));
    let m;
    if ((m = h.match(/^flow-(.+?)(?:-step(\d+))?$/)) && IDX.scenarios[m[1]]){ s.view='flow'; s.flow=m[1]; s.step=+(m[2]||1); }
    else if (IDX.systems[h]){ s.system=h; s.group=sys(h).group; s.view='group'; }
    else if ((m = h.match(/^group-([a-z-]+?)(?:-in-([a-z]+))?$/)) && IDX.groups[m[1]]){ s.view='group'; s.group=m[1]; if (m[2]) s.region=m[2].toUpperCase(); }
    else if ((m = h.match(/^region-([a-z]+)$/))){ s.region=m[1].toUpperCase(); }
  } else {
    const p = new URLSearchParams(location.search);
    if (p.get('flow') && IDX.scenarios[p.get('flow')]){ s.view='flow'; s.flow=p.get('flow'); s.step=+(p.get('step')||1); }
    else {
      if (IDX.groups[p.get('group')]){ s.group=p.get('group'); s.view='group'; }
      if (IDX.regions[p.get('region')]) s.region=p.get('region');
      if (IDX.systems[p.get('system')]){ s.system=p.get('system'); s.group ||= sys(s.system).group; s.view='group'; }
    }
  }
  if (s.view==='flow'){ const n = IDX.scenarios[s.flow].steps.length; s.step = Math.min(Math.max(1, s.step||1), n); }
  return s;
}
function go(patch, {replace=false, focusPanel=false}={}){
  state = {...state, ...patch};
  const url = toURL();
  try { (replace ? history.replaceState : history.pushState).call(history, null, '', url); } catch(e){ /* sandboxed frames may refuse */ }
  render(); if (focusPanel) focusPanelHeading();
}
window.addEventListener('popstate', () => { state = fromURL(); render(); restoreFocus(); });
window.addEventListener('hashchange', () => { if (HASH_ONLY){ state = fromURL(); render(); restoreFocus(); } });

/* ---------- render ---------- */
function render(){
  $('#nav-atlas').toggleAttribute('aria-current', state.view!=='flow'); if (state.view!=='flow') $('#nav-atlas').setAttribute('aria-current','page');
  $('#nav-flow').toggleAttribute('aria-current', state.view==='flow'); if (state.view==='flow') $('#nav-flow').setAttribute('aria-current','page');
  const app = $('#app');
  if (state.view==='flow'){ app.innerHTML = renderFlow(); wireFlow(); }
  else {
    const list = state.group ? renderGroup() : renderHome();
    const panel = state.system ? renderPanel(sys(state.system)) : '';
    app.innerHTML = crumbs() + regionChips() + `<div class="split${panel ? ' has-panel' : ''}"><div class="list">${list}</div>${panel}</div>`;
    wireAtlas();
  }
  $('#foot').innerHTML = `Data as of ${fmtDate(D.meta.as_of)}. ${esc(D.meta.scope)} Every claim links to its source in the record. Corrections by pull request.`;
  document.title = state.system ? `${sys(state.system).short} · Settlement Map` : state.view==='flow' ? 'Railroom · Settlement Map' : 'Settlement Map';
}

function crumbs(){
  const parts = [`<a href="${hrefFor({view:'home',group:null,system:null,region:'ALL'})}" data-go='{"view":"home","group":null,"system":null,"region":"ALL"}'>World</a>`];
  if (state.group) parts.push(`<a href="${hrefFor({group:state.group,system:null})}" data-go='{"group":"${state.group}","system":null}'>${esc(IDX.groups[state.group].name)}</a>`);
  if (state.region!=='ALL') parts.push(`<a href="${hrefFor({system:null})}" data-go='{"system":null}'>${esc(IDX.regions[state.region].name)}</a>`);
  if (state.system) parts.push(`<span aria-current="location">${esc(sys(state.system).short)}</span>`);
  else { const last = parts.pop(); parts.push(last.replace(/^<a [^>]*>(.*)<\/a>$/, '<span aria-current="location">$1</span>')); }
  return `<nav class="crumbs" aria-label="Breadcrumb">${parts.join('<span class="sep" aria-hidden="true">›</span>')}</nav>`;
}
function hrefFor(patch){ const keep = state; state = {...state, ...patch}; const u = toURL(); state = keep; return u.startsWith('#') ? u : (u || '#'); }

function regionChips(){
  const opts = [['ALL','All'], ...D.regions.map(r => [r.id, r.name])];
  return `<div class="regions" role="group" aria-label="Region filter"><span>Region</span>${opts.map(([id,n]) =>
    `<button class="chip" type="button" data-region="${id}" aria-pressed="${state.region===id}">${esc(n)}</button>`).join('')}</div>`;
}

function renderHome(){
  const rows = [...D.groups].sort((a,b)=>a.order-b.order).map(g => {
    const n = D.systems.filter(s => s.group===g.id && inRegion(s)).length;
    return `<li><a class="row${n ? '' : ' empty'}" href="${hrefFor({view:'group',group:g.id,system:null})}" data-go='{"view":"group","group":"${g.id}","system":null}' data-row="${g.id}">
      <span class="row-name">${esc(g.name)}</span>
      <span class="row-count">${n ? `${n} system${n>1?'s':''}` : 'Phase 2'}</span>
      <span class="row-def">${esc(g.definition)}</span></a></li>`;
  }).join('');
  const where = state.region==='ALL' ? 'worldwide' : 'in ' + IDX.regions[state.region].name;
  return `<h1>Who settles what, and where it ends up</h1>
    <p class="lede">Seven kinds of payment infrastructure ${esc(where)}. Open a group to see its systems, then follow any system down to the central bank account where it finally settles.</p>
    <ul class="rows" aria-label="Groups">${rows}</ul>`;
}

function renderGroup(){
  const g = IDX.groups[state.group];
  const list = D.systems.filter(s => s.group===g.id && inRegion(s));
  const body = list.length ? `<div class="tablebox"><table class="stack"><thead><tr><th scope="col">System</th><th scope="col">Operator</th><th scope="col">Settles in</th><th scope="col">Timing</th><th scope="col">Hours</th></tr></thead><tbody>
    ${list.map(s => `<tr data-row="${s.id}" aria-selected="${state.system===s.id}">
      <td class="sys" data-label="System"><span class="cc" title="${esc(IDX.regions[s.region].name)}">${esc(s.region==='GLOBAL'?'GL':s.region)}</span><button type="button" data-open="${s.id}">${esc(s.name)}</button>${s.status==='planned'?'<span class="st-planned">planned</span>':''}</td>
      <td data-label="Operator">${esc(party(s.operator).name)}</td>
      <td data-label="Settles in">${settlesCell(s)}</td>
      <td data-label="Timing">${s.settlement_timing ? esc(s.settlement_timing) : '<span class="unknown">Not confirmed</span>'}</td>
      <td data-label="Hours">${s.hours ? esc(s.hours) : '<span class="unknown">Not confirmed</span>'}</td></tr>`).join('')}
    </tbody></table></div>` : `<p class="muted">No ${esc(g.name.toLowerCase())} systems are loaded for this region yet. They arrive in Phase 2.</p>`;
  return `<h1>${esc(g.name)}</h1><p class="lede">${esc(g.definition)}</p>${body}`;
}
function settlesCell(s){
  if (s.settlement_mode==='none') return '<span class="muted">Does not settle</span>';
  if (!s.settles_in) return s.settlement_mode==='unknown' ? '<span class="unknown">Not confirmed</span>' : '<span class="muted">Final here</span>';
  return `<a class="settle-link" href="${hrefFor({system:s.settles_in, group:sys(s.settles_in).group})}" data-open="${s.settles_in}">${esc(sys(s.settles_in).short)} ↓</a>`;
}

function srcNames(ids){ const pubs=[...new Set(ids.map(i=>IDX.sources[i]?.publisher).filter(Boolean))]; return pubs.join(', ').replace(/\.$/,''); }
function allSourceIds(s){ return [...new Set(Object.values(s.field_sources).flat())]; }

function renderPanel(s){
  const ch = chain(s.id);
  const feeders = (IDX.feeders[s.id]||[]).map(sys);
  const up = feeders.length, down = s.settles_in;
  const fld = (k, label, val) => `<div${k==='settles_in'?' class="settles"':''} style="display:contents"><dt>${label}</dt><dd>${val}</dd></div>`;
  const settlesVal = s.settlement_mode==='none' ? 'Does not settle' : s.settles_in ? esc(sys(s.settles_in).name) : s.settlement_mode==='unknown' ? '<span class="unknown">Not confirmed</span>' : 'Final here';
  const ladder = ch.map((c,i) => {
    const next = ch[i+1];
    const how = next ? `${MODE[c.settlement_mode]}${c.settlement_timing ? ' · ' + c.settlement_timing : ''}` :
      (c.settlement_mode==='central-bank-ledger' ? `Final. ${c.settlement_asset}` : c.settlement_mode==='none' ? 'Carries messages only' : 'End of the known path. Where it settles is not confirmed.');
    return `<li class="rung${i===0?' here':''}${!next?' terminal':''}"><span class="rail" aria-hidden="true"></span><div class="body">
      ${i===0 ? `<strong>${esc(c.name)}</strong>` : `<button class="to" type="button" data-open="${c.id}">${esc(c.name)}</button>`}
      <span class="how">${esc(how)}</span></div></li>`;
  }).join('');
  const flows = (IDX.flowsFor[s.id]||[]);
  const flowLink = flows.length ? `<a class="flowlink" href="${hrefFor({view:'flow',flow:flows[0],step:1})}" data-flow="${flows[0]}">Show the flow →</a>` :
    `<p class="srcline">No flow drawn for this system yet. Canada flows on RTR and ACSS come with Phase 4.</p>`;
  const fs = s.field_sources;
  const srcRows = D.sources.filter(x => allSourceIds(s).includes(x.id)).map(x => {
    const fields = Object.entries(fs).filter(([,v]) => v.includes(x.id)).map(([k]) => k.replace(/_/g,' ')).join(', ');
    return `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a><span class="code">${esc(x.tier)} · ${x.published ? 'dated ' + esc(x.published) + ' · ' : ''}checked ${esc(x.accessed)} · supports ${esc(fields)}</span></li>`;
  }).join('');
  return `<aside class="panel${state.sheetFull?' full':''}" id="panel" aria-labelledby="panel-title" role="region">
    <div class="panel-bar"><button class="icon-btn grip" type="button" id="sheet-size" aria-expanded="${state.sheetFull}">${state.sheetFull?'Half height':'Full height'}</button>
      <span></span><button class="icon-btn" type="button" id="panel-close" aria-label="Close record">Close ×</button></div>
    <h2 id="panel-title" tabindex="-1">${esc(s.name)}${s.status==='planned'?' <span class="st-planned">planned</span>':''}</h2>
    <p class="kind">${esc(IDX.groups[s.group].name)} · ${esc(IDX.regions[s.region].name)}</p>
    <dl class="facts">
      ${fld('operator','Operator', esc(party(s.operator).name))}
      ${fld('participants','Participants', s.participants_summary ? esc(s.participants_summary) : '<span class="unknown">Not confirmed</span>')}
      ${fld('asset','Settlement asset', s.settlement_asset ? esc(s.settlement_asset) : '<span class="unknown">Not confirmed</span>')}
      ${fld('hours','Hours', s.hours ? esc(s.hours) : '<span class="unknown">Not confirmed</span>')}
      ${fld('settles_in','Settles in', settlesVal)}
    </dl>
    <p class="explain">${esc(s.explainer)}</p>
    <p class="srcline">Source: ${esc(srcNames(fs.explainer||[]))}. Checked ${fmtDate(s.last_checked)}.</p>

    <section class="drill" aria-labelledby="drill-h">
      <h3 id="drill-h">Settlement path</h3>
      <ol class="ladder">${ladder}</ol>
      <div class="drill-btns">
        <button type="button" data-open="${down||''}" ${down?'':'disabled'}>↓ Drill down${down?' to '+esc(sys(down).short):''}</button>
        <button type="button" id="drill-up" ${up?'':'disabled'} aria-expanded="false" aria-controls="feeders">↑ Settles here (${up})</button>
      </div>
      <ul class="feeders" id="feeders" hidden>${feeders.map(f => `<li><button type="button" data-open="${f.id}">${esc(f.name)}</button><span class="code muted">${esc(MODE[f.settlement_mode])}${f.settlement_timing?' · '+esc(f.settlement_timing):''}</span></li>`).join('')}</ul>
    </section>
    ${flowLink}

    <details><summary>Rulebook and operator</summary><div>
      <p>Operator: ${esc(party(s.operator).name)}. Rules set by: ${s.scheme_owner ? esc(party(s.scheme_owner).name) : 'no separate rulebook'}.</p>
      <p class="code muted">Roles: ${s.roles.map(esc).join(', ')} · Settlement: ${esc(MODE[s.settlement_mode])}</p></div></details>
    <details><summary>Participants</summary><div><p>${s.participants_summary ? esc(s.participants_summary) : 'Not confirmed.'}</p><p class="srcline">Source: ${esc(srcNames(fs.participants_summary||[])) || 'none yet'}.</p></div></details>
    <details><summary>Caveats</summary><div>${s.caveats.length ? `<ul>${s.caveats.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>` : '<p class="muted">None recorded.</p>'}</div></details>
    <details><summary>Not known yet</summary><div>${s.unknowns.length ? `<ul>${s.unknowns.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>` : '<p class="muted">Nothing open.</p>'}</div></details>
    <details><summary>All sources</summary><div><ul class="srclist">${srcRows}</ul><p class="code muted">Last checked ${esc(s.last_checked)}</p></div></details>
  </aside>`;
}

/* ---------- Railroom ---------- */
function renderFlow(){
  const sc = IDX.scenarios[state.flow];
  const st = sc.steps[state.step-1];
  const phases = ['authorization','clearing','settlement'];
  const rail = sys(sc.rail);
  const lineName = {message:'Message', money:'Money movement', settlement:'Settlement', customer:'Customer'};
  return `<nav class="crumbs" aria-label="Breadcrumb"><a href="${hrefFor({view:'home',group:null,system:null})}" data-go='{"view":"home","group":null,"system":null,"flow":null}'>World</a><span class="sep" aria-hidden="true">›</span><span>Railroom</span><span class="sep" aria-hidden="true">›</span><span aria-current="location">${esc(sc.title)}</span></nav>
    <div class="flow-head"><h1>${esc(sc.title)}</h1>
      <span class="code muted">Rail: <a class="settle-link" href="${hrefFor({view:'group',system:rail.id,group:rail.group,flow:null})}" data-open-map="${rail.id}">${esc(rail.name)}</a></span></div>
    <p class="lede">${esc(sc.summary)}</p>
    <p class="legend-inline">Dashed thin line: a message. Solid line: money moving between accounts at a commercial bank. Double line ending in the settlement column: final settlement in central bank money. Plain text in a lane: what the customer sees.</p>
    <div class="diagram" id="diagram" role="img" aria-label="Sequence diagram, ${sc.steps.length} steps. The same steps are listed in text below.">${svgFlow(sc)}</div>
    <div class="controls">
      <button type="button" id="prev" ${state.step===1?'disabled':''}>← Previous</button>
      <button type="button" id="next" ${state.step===sc.steps.length?'disabled':''}>Next →</button>
      <label class="scrub"><span class="code muted">Step ${state.step} of ${sc.steps.length} · ${esc(st.phase)} · ${esc(st.timing)}</span>
        <input type="range" id="scrub" min="1" max="${sc.steps.length}" value="${state.step}" aria-label="Step">
        <span class="marks" aria-hidden="true">${phases.map(p => `<span>${p}</span>`).join('')}<span>${esc(sc.steps.at(-1).timing)}</span></span></label>
    </div>
    <p class="caption" aria-live="polite"><span class="code">${state.step}. ${esc(lineName[st.type])}</span>${esc(st.caption)}</p>
    <div class="four">
      ${[['messaging','Messaging'],['money','Money movement'],['settlement','Settlement'],['customer','Customer sees']].map(([k,l]) =>
        `<div><h3${k==='settlement'?' class="settle"':''}>${l}</h3><p>${esc(sc.explainer[k].text)}</p><p class="srcline" style="margin:0">Source: ${esc(srcNames(sc.explainer[k].sources))}</p></div>`).join('')}
    </div>
    <h3 class="code" style="text-transform:uppercase;letter-spacing:.08em;font-size:var(--s1)">Steps in text</h3>
    <ol class="steps-text">${sc.steps.map(x => `<li${x.n===state.step?' aria-current="step"':''}>${esc(x.caption)} <span class="code">${esc(lineName[x.type])} · ${esc(x.timing)} · ${esc(srcNames(x.sources))}</span></li>`).join('')}</ol>
    <details><summary>Caveats</summary><div><ul>${sc.caveats.map(c=>`<li>${esc(c)}</li>`).join('')}</ul></div></details>`;
}

function svgFlow(sc){
  const lanes = [...sc.lanes, sc.settlement_lane];
  const colW = 128, left = 34, top = 52, rowH = 58, w = left + lanes.length*colW + 8, h = top + sc.steps.length*rowH + 16;
  const x = id => left + lanes.indexOf(id)*colW + colW/2;
  const settleX = x(sc.settlement_lane);
  let g = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="m-open" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9" fill="none" stroke="context-stroke" stroke-width="1.4"/></marker>
      <marker id="m-fill" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker>
    </defs>`;
  lanes.forEach((id,i) => {
    const cx = x(id), settle = id===sc.settlement_lane;
    const words = party(id).name.replace(/\s*\(.*\)/,'').split(' ');
    const l1 = [], l2 = []; words.forEach(wd => ((l1.join(' ').length + wd.length < 16) && !l2.length ? l1 : l2).push(wd));
    g += `<text class="lane-label${settle?' settle':''}" x="${cx}" y="18" text-anchor="middle">${esc(settle?'Settlement':l1.join(' '))}</text>`;
    g += `<text class="lane-label${settle?' settle':''}" x="${cx}" y="33" text-anchor="middle">${esc(settle?party(id).name:l2.join(' '))}</text>`;
    g += `<line class="lane-rule${settle?' settle':''}" x1="${cx}" x2="${cx}" y1="${top-8}" y2="${h-6}"/>`;
  });
  sc.steps.forEach((st,i) => {
    const y = top + i*rowH + 22, on = st.n===state.step ? ' on' : '';
    const fx = x(st.from), tx = x(st.to);
    g += `<g class="step${on}" data-step="${st.n}"><text class="step-num" x="4" y="${y+4}">${st.n}</text>`;
    if (st.type==='customer'){
      g += `<text class="lbl" x="${fx}" y="${y+4}" text-anchor="middle">${st.n===1?'asks to pay':'sees credit'}</text>`;
    } else if (st.type==='money' && st.from===st.to){
      g += `<line class="ln" x1="${fx-26}" x2="${fx+26}" y1="${y}" y2="${y}" stroke-width="2.5"/><text class="lbl" x="${fx}" y="${y+18}" text-anchor="middle">book entry</text>`;
    } else if (st.type==='message'){
      g += `<line class="ln" x1="${fx}" x2="${tx-4}" y1="${y}" y2="${y}" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#m-open)"/>`;
      if (st.via) g += `<text class="lbl" x="${x(st.via)}" y="${y-7}" text-anchor="middle">${esc(party(st.via)?.name || sys(st.via)?.short)}</text>`;
    } else if (st.type==='money'){
      const dir = tx>fx ? -6 : 6;
      g += `<line class="ln" x1="${fx}" x2="${tx+dir}" y1="${y}" y2="${y}" stroke-width="2.5" marker-end="url(#m-fill)"/>`;
      g += `<text class="lbl" x="${(fx+tx)/2}" y="${y-7}" text-anchor="middle">credit</text>`;
    } else if (st.type==='settlement'){
      // double line from sender to the settlement column, then back to the receiver
      for (const off of [-2.5, 2.5]){
        g += `<line class="ln settle" x1="${fx}" x2="${settleX}" y1="${y-8+off}" y2="${y-8+off}" stroke-width="1.6"/>`;
        g += `<line class="ln settle" x1="${settleX}" x2="${tx}" y1="${y+10+off}" y2="${y+10+off}" stroke-width="1.6"/>`;
      }
      g += `<line class="ln settle" x1="${settleX}" x2="${settleX}" y1="${y-14}" y2="${y+16}" stroke-width="2.5"/>`;
      g += `<text class="lbl" x="${(fx+settleX)/2}" y="${y-15}" text-anchor="middle">${esc(sys(st.via)?.short || '')}</text>`;
      g += `<text class="lbl final" x="${settleX+6}" y="${y+4}">final</text>`;
    }
    g += `</g>`;
  });
  return g + `</svg>`;
}

/* ---------- events ---------- */
function openSystem(id){
  if (!id || !sys(id)) return;
  const active = document.activeElement?.closest('[data-row]');
  if (active && !state.system) lastRowFocus = active.dataset.row;
  else if (!state.system) lastRowFocus = id;
  go({view:'group', system:id, group: state.group && sys(id).group===state.group ? state.group : sys(id).group, flow:null}, {focusPanel:true});
}
function closePanel(){ const id = state.system; go({system:null, sheetFull:false}); restoreFocus(id); }
function focusPanelHeading(){ const h = $('#panel-title'); if (h) h.focus({preventScroll:false}); }
function restoreFocus(id){
  const target = id || lastRowFocus; if (!target) return;
  const row = document.querySelector(`[data-row="${target}"] button, a[data-row="${target}"]`); if (row) row.focus();
}

function wireAtlas(){
  const app = $('#app');
  app.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); go(JSON.parse(a.dataset.go)); }));
  app.querySelectorAll('[data-region]').forEach(b => b.addEventListener('click', () => go({region:b.dataset.region}, {replace:true})));
  app.querySelectorAll('[data-open]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); openSystem(b.dataset.open); }));
  app.querySelectorAll('tbody tr[data-row]').forEach(tr => tr.addEventListener('click', () => openSystem(tr.dataset.row)));
  app.querySelectorAll('[data-flow]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); go({view:'flow', flow:a.dataset.flow, step:1, system:null}); }));
  $('#panel-close')?.addEventListener('click', closePanel);
  $('#sheet-size')?.addEventListener('click', () => { state.sheetFull = !state.sheetFull; $('#panel').classList.toggle('full', state.sheetFull); const b=$('#sheet-size'); b.setAttribute('aria-expanded', state.sheetFull); b.textContent = state.sheetFull?'Half height':'Full height'; });
  $('#drill-up')?.addEventListener('click', e => { const f = $('#feeders'); f.hidden = !f.hidden; e.currentTarget.setAttribute('aria-expanded', !f.hidden); if (!f.hidden) f.querySelector('button')?.focus(); });
}
function wireFlow(){
  const app = $('#app'), n = IDX.scenarios[state.flow].steps.length;
  app.querySelectorAll('[data-go]').forEach(a => a.addEventListener('click', e => { e.preventDefault(); go(JSON.parse(a.dataset.go)); }));
  app.querySelector('[data-open-map]')?.addEventListener('click', e => { e.preventDefault(); const id = e.currentTarget.dataset.openMap; go({view:'group', group:sys(id).group, system:id, flow:null}, {focusPanel:true}); });
  const setStep = (k) => { go({step:Math.min(n, Math.max(1, k))}, {replace:true}); const s = $('#scrub'); s && s.focus(); };
  $('#prev').addEventListener('click', () => { setStep(state.step-1); $('#prev')?.focus(); });
  $('#next').addEventListener('click', () => { setStep(state.step+1); (state.step===n ? $('#prev') : $('#next'))?.focus(); });
  $('#scrub').addEventListener('input', e => setStep(+e.target.value));
  app.querySelectorAll('.step').forEach(g => g.addEventListener('click', () => setStep(+g.dataset.step)));
}

document.addEventListener('keydown', e => {
  if (e.key==='Escape' && state.system){ e.preventDefault(); closePanel(); return; }
  if (state.view==='flow' && (e.key==='ArrowRight'||e.key==='ArrowLeft') && !e.target.matches('input')){
    e.preventDefault(); const n = IDX.scenarios[state.flow].steps.length;
    go({step:Math.min(n, Math.max(1, state.step + (e.key==='ArrowRight'?1:-1)))}, {replace:true}); return;
  }
  if ((e.key==='ArrowDown'||e.key==='ArrowUp') && e.target.closest('.rows, tbody')){
    const items = [...document.querySelectorAll('.rows a.row, tbody td.sys button')];
    const i = items.indexOf(e.target); if (i<0) return;
    e.preventDefault(); items[Math.min(items.length-1, Math.max(0, i + (e.key==='ArrowDown'?1:-1)))].focus();
  }
});
document.querySelectorAll('header [data-nav]').forEach(a => a.addEventListener('click', e => {
  e.preventDefault();
  if (a.dataset.nav==='flow') go({view:'flow', flow:D.scenarios[0].id, step:1, system:null});
  else go({view:'home', group:null, system:null, flow:null});
}));

load().then(d => { D = d; index(); state = fromURL(); render(); if (state.system) focusPanelHeading(); })
  .catch(err => { $('#app').innerHTML = `<div class="err"><strong>The atlas data did not load.</strong> ${esc(err.message)}. Serve the repo root with a local web server (for example <span class="code">npx serve .</span>) and open /prototype/canada/.</div>`; });
})();
</script>
